# actionlint knows the GitHub-hosted runner labels and the generic self-hosted
# ones (self-hosted / linux / macos / windows / x64 / arm64), but not the
# fleet-specific labels the GDH self-hosted runners carry. Without this file
# every `runs-on: [self-hosted, ..., wm]` is a runner-label error.
#
# These map to the org runners registered for GDH-Technologies:
#   wm       -> workflow-master (Fedora, x86_64): builds
#   wm-light -> workflow-master-light (same box): short jobs -- guardrails,
#               deploy detect, the Linux install, the version bump
#   air0       -> air-0 (Apple Silicon macOS): builds
#   air0-light -> air-0-light (same box): the macOS install
#   win0     -> WIN-NODE-0 (Windows x86_64)
self-hosted-runner:
  labels:
    - wm
    - wm-light
    - air0
    - air0-light
    - win0
