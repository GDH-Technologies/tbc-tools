name: "GDH version bump"

# Cut a GDH fork version tag: v<upstream>-gdh-<major>.<minor>.
#
# The tag is the only INPUT for the GDH version: scripts/gdh_version.py scans
# Conventional Commits since the last gdh tag to pick the level, and this
# workflow just runs it somewhere with a trustworthy set of tags.
#
# The bump also commits .gdh-version to main and tags that commit. That file is
# the version for consumers that cannot see tags -- a Nix build gets only the
# tracked tree -- so it has to be pushed with the tag, not after it. This needs
# main to accept a push from github-actions[bot]; if main is protected, grant
# the bot an exception or the bump step will fail at the push.
#
# GDH tags are excluded from release.yml's trigger, so cutting one here does NOT
# publish a GitHub Release or touch harrypm's release path.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level (auto scans Conventional Commits since the last gdh tag)"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "minor", "major"]
      dry_run:
        description: "Only print the proposal; do not create or push a tag"
        required: false
        default: true
        type: boolean

jobs:
  bump:
    name: Propose and tag
    # Self-hosted: GitHub-hosted minutes are billable, and the fleet runner
    # already has everything this needs (git + python3).
    runs-on: [self-hosted, Linux, X64, wm]
    steps:
      - name: Refuse to tag from anywhere but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "GDH version tags are only cut from refs/heads/main (current: $REF)." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Both are mandatory: the resolver walks tags and counts commits, and
          # a shallow checkout silently resolves the wrong base.
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Refresh tags
        # The self-hosted workspace persists between runs, so a tag deleted or
        # moved on the remote can linger locally and poison `git describe`.
        run: git fetch --tags --prune --prune-tags --force origin

      - name: Propose the next version
        id: propose
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set +e
          OUTPUT="$(python3 scripts/gdh_version.py propose --level "$LEVEL" 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"
          {
            echo "## GDH version bump"
            echo
            echo '```'
            printf '%s\n' "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -eq 2 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in range warrants a release; re-run with level=minor or level=major to force one." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the version file and push the tag
        if: ${{ inputs.dry_run == false && steps.propose.outputs.proceed == 'true' }}
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --branch is mandatory here: actions/checkout leaves HEAD detached,
          # so the script cannot work out where the version commit belongs. The
          # first step of this job has already refused anything but main.
          python3 scripts/gdh_version.py bump --level "$LEVEL" --push --branch main \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Note that this was a dry run
        if: ${{ inputs.dry_run == true && steps.propose.outputs.proceed == 'true' }}
        run: |
          echo "Dry run: no tag was created. Re-run with dry_run=false to cut it." \
            | tee -a "$GITHUB_STEP_SUMMARY"
