name: "GDH version bump"

# Open a PR that releases the next GDH version: v<upstream>-gdh-<major>.<minor>.
#
# A release is a committed .gdh-version, and it normally rides inside whichever
# PR you choose: run `python3 scripts/gdh_version.py bump --level minor` on that
# branch. The PR's builds then carry the new version on every platform, the
# merge deploy reuses them, and gdh-version-tag.yml tags the merge commit.
#
# This workflow is for a release with no code PR to carry it. It commits the
# bump on chore/version-<v> (never on main), opens the PR, and dispatches the
# PR's CI: GitHub does not create pull_request runs for a PR opened with
# GITHUB_TOKEN, but workflow_dispatch is exempt from that rule, and dispatched
# runs attach their checks to the branch head. Merging the PR deploys like any
# other merge.
#
# It needs "Allow GitHub Actions to create and approve pull requests" enabled
# for this repository (Settings -> Actions -> General). This job is the only
# holder of pull-requests: write; check_ci_contracts.py keeps it that way.
#
# GDH tags are excluded from release.yml's trigger, so the tag this leads to
# does NOT publish a GitHub Release or touch harrypm's release path.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level (auto scans Conventional Commits since the last release)"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "minor", "major"]
      dry_run:
        description: "Only print the proposal; do not push a branch or open a PR"
        required: false
        default: true
        type: boolean

jobs:
  bump:
    name: Propose and open the bump PR
    # Self-hosted: GitHub-hosted minutes are billable, and the fleet runner
    # already has everything this needs (git + python3 + gh). wm-light is wm's
    # second runner for short jobs, so a bump never waits behind a build.
    runs-on: [self-hosted, Linux, X64, wm-light]
    permissions:
      # Push the chore/version-<v> branch (never main).
      contents: write
      # Open its PR. Only this job may hold it.
      pull-requests: write
      # Dispatch the PR's CI.
      actions: write
    steps:
      - name: Refuse to run from anywhere but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "GDH version bumps are proposed from refs/heads/main (current: $REF)." >&2
            exit 1
          fi

      - name: Checkout repository
        # Pinned to v5's commit: this job holds write tokens.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Both are mandatory: the resolver walks tags and counts commits, and
          # a shallow checkout silently resolves the wrong base.
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Refresh tags
        # The self-hosted workspace persists between runs, so a tag deleted or
        # moved on the remote can linger locally and poison `git describe`.
        run: git fetch --tags --prune --prune-tags --force origin

      - name: Propose the next version
        id: propose
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set +e
          OUTPUT="$(python3 scripts/gdh_version.py propose --level "$LEVEL" 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"
          {
            echo "## GDH version bump"
            echo
            echo '```'
            printf '%s\n' "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$OUTPUT" > "$RUNNER_TEMP/proposal.txt"

          if [ "$STATUS" -eq 2 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in range warrants a release; re-run with level=minor or level=major to force one." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the bump and push its branch
        id: branch
        if: ${{ inputs.dry_run == false && steps.propose.outputs.proceed == 'true' }}
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/gdh_version.py bump --level "$LEVEL" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/gdh_version.py check-pr --base origin/main
          VERSION="$(tr -d '\n' < .gdh-version)"
          BRANCH="chore/version-$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "A bump branch for $VERSION already exists: $BRANCH. Merge or delete its PR first." >&2
            exit 1
          fi
          # A new branch, never main: the release lands through its PR.
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: ${{ steps.branch.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.branch.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Release **$VERSION**: \`.gdh-version\` = \`$VERSION\`."
            echo
            echo "Merging deploys the fleet with this PR's own builds, and gdh-version-tag.yml then tags the merge commit \`v$VERSION\`. Merge with a merge commit (or squash), not a rebase: a rebase merge tags the rebased bump commit."
            echo
            echo '```'
            cat "$RUNNER_TEMP/proposal.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(version): $VERSION" --body-file "$RUNNER_TEMP/body.md" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the pull request's CI
        # A PR opened with GITHUB_TOKEN gets no pull_request runs. Dispatched
        # runs on the branch attach their checks to its head commit instead.
        if: ${{ steps.branch.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run self-hosted-guardrails.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run self-hosted-linux.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run self-hosted-macos.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run self-hosted-windows.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          echo "Dispatched guardrails, Linux, macOS and Windows CI on $BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Note that this was a dry run
        if: ${{ inputs.dry_run == true && steps.propose.outputs.proceed == 'true' }}
        run: |
          echo "Dry run: no branch or PR was created. Re-run with dry_run=false to open the bump PR." \
            | tee -a "$GITHUB_STEP_SUMMARY"
