name: "Self-hosted macOS build (air0)"

# Fork-exclusive. Native arm64 build, test, .app assembly and DMG on the GDH
# air-0 box.
#
# Not a copy of build_macos_tools.yml: that file is shared with
# harrypm/tbc-tools and must stay byte-identical so upstream merges never
# conflict. The packaging steps below are ported from it; the differences are
# all forced by the machine:
#
#   * arm64 only. There is no self-hosted Intel Mac, so the hosted job's
#     build-universal-macos lipo merge has no second half to merge and is
#     dropped -- along with its internal_* transfer artifacts and the
#     `actions: write` permission their REST deletion needed. This workflow
#     runs with contents: read.
#   * air0 is on macOS 26.6.2. The hosted job pins macos-15 because the
#     flake.lock-pinned nixpkgs Qt uic SIGTRAPs on macOS 26 during CMake
#     AUTOUIC -- that was measured on the GitHub image, and it does NOT
#     reproduce here: `nix build .#` compiles tbc-tools from source on air0
#     and succeeds. The step order still prints sw_vers first so a future
#     regression is visible at the top of the log rather than buried.
#   * Python 3.11 and create-dmg come from nixpkgs rather than
#     actions/setup-python and Homebrew. setup-python's macOS package wants to
#     write /usr/local/bin on a personal machine, and air0 having brew today
#     is not a reason to depend on it.
#   * No cache-nix-action. The disk persists; anything cached lives outside
#     the workspace, because actions/checkout runs `git clean -ffdx`.
#   * Two jobs, one compile. `test` runs on air0-test, air0's dedicated test
#     runner: `nix build .#` compiles tbc-tools and runs ctest inside the build
#     (flake.nix doCheck), so the tested binaries are the shipped ones.
#     `package` runs on the main air0 runner once `test` passes. The two
#     runners share air0's Nix store, so its `nix build .#` is a store hit and
#     the runner is busy only for the bundle and DMG.

on:
  # Path-gated so a docs-only or tooling-only change does not occupy the single
  # macos box for a full build. These mirror self-hosted-deploy.yml's
  # per-platform filters, so what triggers a PR build is exactly what triggers
  # a redeploy on merge. Note the consequence: a PR touching none of these
  # produces no run at all, so none of these may be marked a required check.
  pull_request:
    paths:
      - "src/**"
      - "ci/**"
      # ...but not the guardrail-only files in it. These cannot change an
      # artifact, and a contract edit should not cost a fleet rebuild. Order
      # matters: a later pattern overrides an earlier one.
      - "!ci/tests/**"
      - "!ci/check_ci_contracts.py"
      - "scripts/**"
      - "CMakeLists.txt"
      - ".gdh-version"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/self-hosted-macos.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "ci/**"
      # ...but not the guardrail-only files in it. These cannot change an
      # artifact, and a contract edit should not cost a fleet rebuild. Order
      # matters: a later pattern overrides an earlier one.
      - "!ci/tests/**"
      - "!ci/check_ci_contracts.py"
      - "scripts/**"
      - "CMakeLists.txt"
      - ".gdh-version"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/self-hosted-macos.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to checkout when invoked as a reusable workflow"
        required: false
        type: string
      release_tag:
        description: "Release tag to use for bundle version metadata"
        required: false
        type: string
      from_deploy:
        description: "Set by self-hosted-deploy.yml so the standalone push run stands down"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Machine-scoped: there is exactly one air0 box. github.workflow resolves to
  # the CALLER's name under workflow_call, so a deploy-driven build lands in
  # its own group and can never be cancelled by a PR run.
  group: tbc-tools-air0-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Build and test tbc-tools (arm64, air0-test)
    # air0's dedicated test runner: registered with --no-default-labels, so its
    # only labels are self-hosted and air0-test and no generic macOS job can
    # land on it.
    runs-on: [self-hosted, air0-test]
    timeout-minutes: 90
    # A merge to main is owned by self-hosted-deploy.yml (from_deploy), and a
    # forked PR must never execute on a workstation -- this repository is
    # public.
    if: >-
      ${{ (github.event_name != 'push' || inputs.from_deploy)
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Report host and toolchain
        # First, deliberately. If a future macOS or nixpkgs bump reintroduces
        # the Qt uic SIGTRAP that pins the hosted job to macos-15, the version
        # that caused it is the first thing in the log.
        run: |
          sw_vers
          uname -m
          nix --version
          xcode-select -p

      - uses: actions/checkout@v5
        # Shallow, no tags, no submodules: the Nix build reads only the tree
        # (its version comes from .gdh-version, its ezpwd from a flake input),
        # and a depth-1 checkout evaluates to the same derivation as a full
        # one. Full history is 6.8 GB -- a fresh workspace spent 40 minutes
        # cloning it at air0's download rate. `package` needs history and tags
        # for gdh_version.py, so it takes a partial clone instead.
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Build and test with Nix
        # ctest runs inside this build (flake.nix: doCheck), serially, and a
        # failing test fails the build. It is the only job a deploy runs.
        #
        # determinate-nixd's automatic GC runs every two hours on air0, and
        # under disk pressure sooner, and deletes any store path without a GC
        # root -- mid-build if need be. On 2026-09-15 (PR #30) it deleted the
        # dev shell's scipy, matplotlib, tqdm and pyzmq 58 s before the
        # teletext test ran; on 2026-09-28 (PR #43), with the disk 95% full, it
        # deleted nixpkgs' unpacked source while `nix build .#` was evaluating
        # it ("path '.../pkgs/development/libraries/qt-6' does not exist").
        #
        # So every flake input source that `nix flake archive` reports gets an
        # indirect root before evaluation starts, and the result gets one via
        # --out-link: the package job's `nix build .#` then finds it in the
        # store instead of recompiling. The roots are named for this run. With
        # one shared name, another PR's test job (or a deploy's, in its own
        # concurrency group) removed them while this run's package job was
        # still queued on the shared air0 runner. `package` removes this run's
        # roots once it has its own; anything a cancelled or failed run left
        # is pruned after a day. The single-name roots of earlier runs, and
        # the dev-shell profile this job used before it built in Nix, go too.
        run: |
          set -euo pipefail
          ROOTS="$HOME/Library/Caches/tbc-tools-selfhosted/gcroots"
          mkdir -p "$ROOTS"
          rm -f "$ROOTS"/devshell "$ROOTS"/devshell-*-link "$ROOTS"/result \
                "$ROOTS"/flake-input-? "$ROOTS"/flake-input-??
          find "$ROOTS" -maxdepth 1 \( -name 'result-*' -o -name 'flake-input-*-*' \) -mtime +1 -print -delete
          n=0
          for path in $(nix flake archive --json | grep -o '"path":"[^"]*"' | cut -d'"' -f4); do
            nix-store --add-root "$ROOTS/flake-input-$GITHUB_RUN_ID-$n" --realise "$path" > /dev/null
            n=$((n + 1))
          done
          echo "Rooted $n flake input sources"
          nix build .# --out-link "$ROOTS/result-$GITHUB_RUN_ID" -L

  package:
    name: Package tbc-tools (arm64, air0)
    needs: test
    runs-on: [self-hosted, macOS, ARM64, air0]
    timeout-minutes: 60
    # Never in a deploy: the deploy installs the Nix build, not the DMG. The
    # fork guard repeats `test`'s so this job cannot run on its own.
    if: >-
      ${{ !inputs.from_deploy
          && github.event_name != 'push'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - name: Reset stale build state
        # Before checkout: parts of a previous run's dist/ were copied out of
        # the Nix store read-only, which checkout's clean chokes on. Harmless
        # when the workspace turns out to be fresh.
        run: |
          cd "$GITHUB_WORKSPACE" 2>/dev/null || exit 0
          chmod -R u+w dist 2>/dev/null || true
          rm -rf dist build result ffmpeg-result ffmpeg-result-* \
                 tbc-tools_arm64.dmg tbc-tools_arm64.app.tgz


      - uses: actions/checkout@v5
        # A partial clone: full history and tags for gdh_version.py (describe,
        # path-limited log), file contents only for HEAD. The full clone held
        # 6.8 GB of old blobs on air0's nearly full disk, where free space
        # decides whether Nix's GC evicts the next build's inputs. No
        # submodules: nothing here reads them, and the Nix build filters both
        # mount points out, so this evaluates to the test job's derivation.
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Record the source tree
        # Artifacts are named for the tree they were built from, not the commit.
        # self-hosted-deploy.yml's plan job reuses a same-repo run's build when
        # the tree being deployed is identical. For a pull_request run this is
        # the tree of refs/pull/N/merge, which is what was built and tested.
        run: echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"

      - name: Refresh tags
        # If the workspace persisted, a tag deleted or moved on the remote can
        # linger locally and poison the `git describe` the version step below
        # relies on. Same reasoning as gdh-version-bump.yml.
        run: git fetch --tags --prune --prune-tags --force origin

      - name: Provision build tools from nixpkgs
        # Replaces actions/setup-python@v6 and `brew install create-dmg`.
        # --out-link rather than --no-link keeps them as GC roots, so Nix's
        # auto-GC cannot collect the interpreter out from under the venv
        # mid-run.
        run: |
          set -euo pipefail
          TOOLS="$HOME/Library/Caches/tbc-tools-selfhosted/tools"
          mkdir -p "$TOOLS"
          nix build nixpkgs#python311  --out-link "$TOOLS/python311"
          nix build nixpkgs#create-dmg --out-link "$TOOLS/create-dmg"
          echo "$TOOLS/create-dmg/bin" >> "$GITHUB_PATH"
          echo "PYTHON311=$TOOLS/python311/bin/python3.11" >> "$GITHUB_ENV"

      - name: Get version info
        id: version
        # The GDH version, by the rule every build uses (a release tag when one
        # is passed in). Before anything is built into the workspace, so the
        # tree is still clean. A bare `git describe` used to set this: it
        # matched upstream's tags too and never saw .gdh-version.
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$("$PYTHON311" scripts/gdh_version.py show)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Nix
        # A store hit: `test` built this exact derivation on this box and
        # rooted it. A miss (GC, or a different tree) would silently recompile
        # and re-run ctest here on the shared runner, so it is announced. Once
        # the workspace `result` roots the output, this run's test roots go.
        run: |
          if nix build .# --dry-run 2>&1 | grep -q 'will be built'; then
            echo "::warning::tbc-tools is not in air0's store; the package job is recompiling (and re-running ctest) instead of reusing the test job's build."
          fi
          nix build .# -L
          ROOTS="$HOME/Library/Caches/tbc-tools-selfhosted/gcroots"
          rm -f "$ROOTS/result-$GITHUB_RUN_ID" "$ROOTS"/flake-input-"$GITHUB_RUN_ID"-*
          mkdir -p dist/bin
          if [ ! -f result/bin/tbc-analyse.app/Contents/MacOS/.tbc-analyse-wrapped ]; then
            echo "Missing wrapped GUI binary: result/bin/tbc-analyse.app/Contents/MacOS/.tbc-analyse-wrapped"
            exit 1
          fi
          
          # Copy wrapped GUI binary (avoid Nix wrapper with hardcoded paths)
          cp result/bin/tbc-analyse.app/Contents/MacOS/.tbc-analyse-wrapped dist/bin/tbc-analyse
          chmod +x dist/bin/tbc-analyse
          
          # Copy wrapped CLI tools (strip leading dot and -wrapped suffix)
          for wrapped in result/bin/.*-wrapped; do
            [ -f "$wrapped" ] || continue
            base="$(basename "$wrapped")"
            base="${base#.}"
            base="${base%-wrapped}"
            cp "$wrapped" "dist/bin/$base"
            chmod +x "dist/bin/$base"
          done
          # Copy additional non-wrapped tools (including tbc-video-export)
          for item in result/bin/*; do
            [ -f "$item" ] || continue
            base="$(basename "$item")"
            [ -e "dist/bin/$base" ] && continue
            cp "$item" "dist/bin/$base"
            chmod +x "dist/bin/$base" 2>/dev/null || true
          done
          # Bundle ffmpeg/ffprobe for self-contained exports. Use the flake's
          # pinned ffmpeg (.#ffmpeg^bin, built from flake.lock-pinned nixpkgs)
          # rather than the live nixos-unstable channel's ffmpeg.bin output:
          # Nixpkgs 26.11 dropped x86_64-darwin, so the live channel throws
          # "Nixpkgs 26.11 has dropped support for x86_64-darwin" on the
          # macos-15-intel runner (the 2>/dev/null previously hid this). The
          # flake's nixpkgs pin still supports both darwin arches -- `nix build .#`
          # above already builds ffmpeg as a buildInput -- so .#ffmpeg^bin works
          # on x86_64-darwin and insulates arm64 from future channel rolls.
          FFMPEG_STORE="$(nix-store -q --references result 2>/dev/null | grep -E '/ffmpeg-[^/]+-bin$' | head -n 1 || true)"
          if [ -z "$FFMPEG_STORE" ]; then
            FFMPEG_ERR="$(mktemp)"
            FFMPEG_STORE="$(nix build .#ffmpeg^bin --no-link --print-out-paths 2>"$FFMPEG_ERR" | tail -n 1 || true)"
            if [ -z "$FFMPEG_STORE" ] || [ ! -x "$FFMPEG_STORE/bin/ffmpeg" ]; then
              echo "nix build .#ffmpeg^bin did not produce a usable ffmpeg bin; stderr:" >&2
              cat "$FFMPEG_ERR" >&2
              rm -f "$FFMPEG_ERR"
              echo "Missing ffmpeg from nixpkgs build"
              exit 1
            fi
            rm -f "$FFMPEG_ERR"
          fi
          if [ -z "$FFMPEG_STORE" ] || [ ! -x "$FFMPEG_STORE/bin/ffmpeg" ]; then
            echo "Missing ffmpeg from nixpkgs build"
            exit 1
          fi
          cp "$FFMPEG_STORE/bin/ffmpeg" dist/bin/ffmpeg
          chmod +x dist/bin/ffmpeg
          if [ -x "$FFMPEG_STORE/bin/ffprobe" ]; then
            cp "$FFMPEG_STORE/bin/ffprobe" dist/bin/ffprobe
            chmod +x dist/bin/ffprobe
          fi

      - name: Create app bundle structure
        run: |
          mkdir -p dist/tbc-tools.app/Contents/{Resources,MacOS,Frameworks,PlugIns,share}

          # Create Info.plist with dynamic version
          cat > dist/tbc-tools.app/Contents/Info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>TBC Tools</string>
              <key>CFBundleExecutable</key>
              <string>tbc-analyse</string>
              <key>CFBundleIconFile</key>
              <string>tbc-tools.icns</string>
              <key>CFBundleIdentifier</key>
              <string>dev.domesday.tbc-tools</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>tbc-tools</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ steps.version.outputs.version }}</string>
              <key>CFBundleVersion</key>
              <string>${{ steps.version.outputs.version }}</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSRequiresAquaSystemAppearance</key>
              <false/>
          </dict>
          </plist>
          EOF

          # Copy binaries to MacOS folder
          cp -r dist/bin/* dist/tbc-tools.app/Contents/MacOS/
          
          # Copy scripts if they exist
          if [ -d "scripts" ]; then
            find scripts -maxdepth 1 -perm -111 -type f -exec cp {} dist/tbc-tools.app/Contents/MacOS/ \; 2>/dev/null || true
          fi

          # Copy AAA (Auto Audio Align) vendor payload. The "Build with Nix" loop
          # above uses `[ -f "$item" ]` which skips the result/bin/vendor directory,
          # so the vendored VhsDecodeAutoAudioAlign.exe + Binah.dll (Mono-runnable
          # .NET assemblies) are missing from the .app. audioalignmentutil.cpp
          # resolves them relative to the app dir (Contents/MacOS), so bundle them
          # at Contents/MacOS/vendor/vhs_decode_auto_audio_align/. Host Mono is a
          # documented end-user requirement on macOS.
          AAA_VENDOR_SRC="result/bin/vendor/vhs_decode_auto_audio_align"
          AAA_VENDOR_DST="dist/tbc-tools.app/Contents/MacOS/vendor/vhs_decode_auto_audio_align"
          if [ ! -f "$AAA_VENDOR_SRC/VhsDecodeAutoAudioAlign.exe" ] || [ ! -f "$AAA_VENDOR_SRC/Binah.dll" ]; then
            echo "Missing AAA vendor payload under $AAA_VENDOR_SRC"
            exit 1
          fi
          mkdir -p "$AAA_VENDOR_DST"
          cp -a "$AAA_VENDOR_SRC/." "$AAA_VENDOR_DST/"
          echo "Bundled AAA vendor payload to $AAA_VENDOR_DST"
          # Copy vhs-teletext vendor payload. Same reason as AAA above: the
          # "Build with Nix" loop uses `[ -f "$item" ]` which skips the
          # result/bin/vendor directory, so the vendored vhs-teletext Python
          # tree is missing from the .app. teletextintegration.cpp resolves it
          # relative to the app dir (Contents/MacOS) at vendor/vhs-teletext, so
          # bundle it there or tbc-process-vbi's --teletext-html-dir export fails
          # with "Could not locate vendored vhs-teletext runtime directory."
          TELETEXT_VENDOR_SRC="result/bin/vendor/vhs-teletext"
          TELETEXT_VENDOR_DST="dist/tbc-tools.app/Contents/MacOS/vendor/vhs-teletext"
          if [ ! -f "$TELETEXT_VENDOR_SRC/teletext/__main__.py" ]; then
            echo "Missing vhs-teletext vendor payload under $TELETEXT_VENDOR_SRC"
            exit 1
          fi
          mkdir -p "$TELETEXT_VENDOR_DST"
          cp -a "$TELETEXT_VENDOR_SRC/." "$TELETEXT_VENDOR_DST/"
          echo "Bundled vhs-teletext vendor payload to $TELETEXT_VENDOR_DST"


      - name: Build self-contained tbc-video-export (PyInstaller)
        # Replace the CMake bash wrapper (which execs a *host* Python with host
        # site-packages) with a PyInstaller --onefile Mach-O binary that bundles
        # the interpreter and all deps.
        #
        # The hosted job uses whatever actions/setup-python put on PATH. Here
        # the interpreter is the provisioned nixpkgs 3.11 in a venv under
        # ~/Library/Caches -- outside the workspace, since checkout's
        # `git clean -ffdx` would delete it in-tree. The venv is recreated
        # whenever it fails to start: a Nix GC of the interpreter store path
        # silently bricks a persistent venv. macOS system /usr/bin/python3 is
        # Xcode's 3.9 and cannot parse the package's 3.10+ pattern matching.
        run: |
          set -euo pipefail
          VENV="$HOME/Library/Caches/tbc-tools-selfhosted/venv-pyinstaller-macos"
          if ! "$VENV/bin/python" -c 'import sys' >/dev/null 2>&1; then
            echo "Creating a fresh PyInstaller venv at $VENV"
            rm -rf "$VENV"
            "$PYTHON311" -m venv "$VENV"
          fi
          # The venv persists outside the workspace. Running pip on every run
          # re-resolved the same versions from PyPI; the stamp skips that until
          # the set changes or a new ISO week starts. As before, only pip itself
          # is upgraded: pyinstaller and dunamai stay at the versions this venv
          # first installed, so a new release cannot break packaging with no
          # code change. A recreated venv has no stamp and installs current ones.
          WANT="pip pyinstaller dunamai $(date +%G-W%V)"
          if [ "$(cat "$VENV/.tbc-requirements" 2>/dev/null)" != "$WANT" ]; then
            "$VENV/bin/python" -m pip install --upgrade pip
            "$VENV/bin/python" -m pip install pyinstaller dunamai
            echo "$WANT" > "$VENV/.tbc-requirements"
          else
            echo "PyInstaller venv current ($WANT); skipping pip"
          fi
          EXPORTER_ROOT="$GITHUB_WORKSPACE/src/tbc-video-export"
          export PYTHONPATH="$EXPORTER_ROOT/src"
          cd "$EXPORTER_ROOT"
          mkdir -p build
          "$VENV/bin/python" pyinstaller/build_macos.py
          cd "$GITHUB_WORKSPACE"
          BUILT="$EXPORTER_ROOT/dist/tbc-video-export"
          if [ ! -f "$BUILT" ]; then
            echo "PyInstaller did not produce $BUILT"
            exit 1
          fi
          cp -f "$BUILT" dist/tbc-tools.app/Contents/MacOS/tbc-video-export
          chmod +x dist/tbc-tools.app/Contents/MacOS/tbc-video-export
          echo "Bundled self-contained tbc-video-export PyInstaller binary"

      - name: Verify app executable architecture
        # The hosted job branches on matrix.arch; air0 is Apple Silicon only.
        run: |
          BIN="dist/tbc-tools.app/Contents/MacOS/tbc-analyse"
          if [ ! -f "$BIN" ]; then
            echo "Expected app executable missing: $BIN"
            exit 1
          fi
          ARCHS="$(lipo -archs "$BIN" 2>/dev/null || true)"
          if [ -z "$ARCHS" ]; then
            echo "Unable to read binary architecture for $BIN"
            file "$BIN" || true
            exit 1
          fi
          echo "$ARCHS" | grep -qw arm64 || { echo "Expected arm64 binary, got: $ARCHS"; exit 1; }
          echo "Verified architecture: $ARCHS"


      - name: Bundle Python deps (numpy)
        # The hosted job assumes `/usr/bin/python3 -m pip` works. On a personal
        # Mac that pip can be absent or externally managed, so fall back to the
        # PyInstaller venv. The bundled test-decode-pretbc shim still execs
        # /usr/bin/python3 at runtime by design -- it runs on the end user's
        # machine, not this one.
        run: |
          APP="dist/tbc-tools.app"
          PY_DIR="$APP/Contents/Resources/python"
          mkdir -p "$PY_DIR"
          VENV="$HOME/Library/Caches/tbc-tools-selfhosted/venv-pyinstaller-macos"
          PYTHON_BIN="/usr/bin/python3"
          if ! "$PYTHON_BIN" -m pip --version >/dev/null 2>&1; then
            PYTHON_BIN="$VENV/bin/python"
          fi
          # numpy must match the interpreter that runs it on the END USER's Mac
          # (/usr/bin/python3 when its pip works here), so the cache is keyed on
          # that interpreter's version and the arch, and refreshed weekly.
          PYVER="$("$PYTHON_BIN" -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
          NUMPY_CACHE="$HOME/Library/Caches/tbc-tools-selfhosted/numpy-$PYVER-$(uname -m)"
          WANT="numpy $(date +%G-W%V)"
          if [ "$(cat "$NUMPY_CACHE/.tbc-requirements" 2>/dev/null)" != "$WANT" ]; then
            rm -rf "$NUMPY_CACHE"
            "$PYTHON_BIN" -m pip install --target "$NUMPY_CACHE" numpy
            echo "$WANT" > "$NUMPY_CACHE/.tbc-requirements"
          else
            echo "numpy cache current for Python $PYVER ($WANT)"
          fi
          rsync -a --exclude .tbc-requirements "$NUMPY_CACHE/" "$PY_DIR/"

          SCRIPT="$APP/Contents/MacOS/test-decode-pretbc"
          if [ -f "$SCRIPT" ] && [ ! -f "$SCRIPT.py" ]; then
            mv "$SCRIPT" "$SCRIPT.py"
            cat > "$SCRIPT" << 'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          PY_DIR="$DIR/../Resources/python"
          export PYTHONPATH="$PY_DIR${PYTHONPATH:+:$PYTHONPATH}"
          if [ -x /usr/bin/python3 ]; then
            PY="/usr/bin/python3"
          else
            PY="$(command -v python3)"
          fi
          exec "$PY" "$DIR/test-decode-pretbc.py" "$@"
          EOF
            chmod +x "$SCRIPT"
          fi


      - name: Create app icon
        run: |
          ICONSET_ROOT="$(mktemp -d)"
          ICONSET="$ICONSET_ROOT/tbc-analyse.iconset"
          mkdir -p "$ICONSET"
          cp src/tbc-analyse/Graphics/16-analyse.png "$ICONSET/icon_16x16.png"
          cp src/tbc-analyse/Graphics/32-analyse.png "$ICONSET/icon_16x16@2x.png"
          cp src/tbc-analyse/Graphics/32-analyse.png "$ICONSET/icon_32x32.png"
          cp src/tbc-analyse/Graphics/64-analyse.png "$ICONSET/icon_32x32@2x.png"
          cp src/tbc-analyse/Graphics/128-analyse.png "$ICONSET/icon_128x128.png"
          cp src/tbc-analyse/Graphics/256-analyse.png "$ICONSET/icon_128x128@2x.png"
          cp src/tbc-analyse/Graphics/256-analyse.png "$ICONSET/icon_256x256.png"
          if command -v sips >/dev/null 2>&1; then
            sips -z 512 512 src/tbc-analyse/Graphics/256-analyse.png --out "$ICONSET/icon_256x256@2x.png"
            sips -z 512 512 src/tbc-analyse/Graphics/256-analyse.png --out "$ICONSET/icon_512x512.png"
            sips -z 1024 1024 src/tbc-analyse/Graphics/256-analyse.png --out "$ICONSET/icon_512x512@2x.png"
          else
            cp src/tbc-analyse/Graphics/256-analyse.png "$ICONSET/icon_256x256@2x.png"
            cp src/tbc-analyse/Graphics/256-analyse.png "$ICONSET/icon_512x512.png"
          fi
          iconutil -c icns "$ICONSET" -o dist/tbc-tools.app/Contents/Resources/tbc-tools.icns

      - name: Bundle Qt plugins and qt.conf
        run: |
          mkdir -p dist/tbc-tools.app/Contents/PlugIns
          
          # Extract plugin paths from Nix wrapper and copy plugins
          PLUGIN_PATHS=$(strings -n 8 result/bin/tbc-analyse.app/Contents/MacOS/tbc-analyse | grep "/qt-6/plugins" | sort -u || true)
          if [ -z "$PLUGIN_PATHS" ]; then
            echo "No Qt plugin paths detected in Nix-built tbc-analyse binary"
            exit 1
          fi
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            if [ -d "$p" ]; then
              rsync -a "$p/" dist/tbc-tools.app/Contents/PlugIns/
            fi
          done <<< "$PLUGIN_PATHS"
          if [ ! -f dist/tbc-tools.app/Contents/PlugIns/platforms/libqcocoa.dylib ]; then
            echo "Missing required Qt platform plugin: dist/tbc-tools.app/Contents/PlugIns/platforms/libqcocoa.dylib"
            exit 1
          fi
          
          cat > dist/tbc-tools.app/Contents/Resources/qt.conf << 'EOF'
          [Paths]
          Plugins = PlugIns
          EOF


      - name: Bundle dependencies
        # Copies every /nix/store dylib and framework into Contents/Frameworks
        # and rewrites load commands and rpaths; see the script's header.
        shell: bash
        run: bash ci/macos_bundle_dependencies.sh dist/tbc-tools.app


      - name: Codesign app bundle (ad-hoc)
        run: |
          codesign --force --deep --sign - "dist/tbc-tools.app"

      - name: Verify app bundle
        run: |
          echo "App bundle contents:"
          find dist/tbc-tools.app -type f | head -20
          if [ ! -d "dist/tbc-tools.app/Contents/_CodeSignature" ]; then
            echo "Missing _CodeSignature after codesign"
            exit 1
          fi
          if [ ! -f "dist/tbc-tools.app/Contents/MacOS/tbc-video-export" ]; then
            echo "Missing vendored exporter tool: dist/tbc-tools.app/Contents/MacOS/tbc-video-export"
            exit 1
          fi
          # tbc-video-export is now a self-contained PyInstaller Mach-O binary,
          # not a bash wrapper + package source. Verify it is a Mach-O executable.
          if ! file "dist/tbc-tools.app/Contents/MacOS/tbc-video-export" 2>/dev/null | grep -q "Mach-O"; then
            echo "tbc-video-export is not a Mach-O binary (expected PyInstaller --onefile): dist/tbc-tools.app/Contents/MacOS/tbc-video-export"
            exit 1
          fi
          # AAA (Auto Audio Align) vendor payload must be bundled at the resolver path.
          if [ ! -f "dist/tbc-tools.app/Contents/MacOS/vendor/vhs_decode_auto_audio_align/VhsDecodeAutoAudioAlign.exe" ]; then
            echo "Missing AAA vendor payload: dist/tbc-tools.app/Contents/MacOS/vendor/vhs_decode_auto_audio_align/VhsDecodeAutoAudioAlign.exe"
            exit 1
          fi
          if [ ! -f "dist/tbc-tools.app/Contents/MacOS/vendor/vhs_decode_auto_audio_align/Binah.dll" ]; then
            echo "Missing AAA vendor payload: dist/tbc-tools.app/Contents/MacOS/vendor/vhs_decode_auto_audio_align/Binah.dll"
            exit 1
          fi
          # vhs-teletext vendor payload must be bundled at the resolver path so
          # tbc-process-vbi's teletext HTML export can find teletext/__main__.py.
          if [ ! -f "dist/tbc-tools.app/Contents/MacOS/vendor/vhs-teletext/teletext/__main__.py" ]; then
            echo "Missing vhs-teletext vendor payload: dist/tbc-tools.app/Contents/MacOS/vendor/vhs-teletext/teletext/__main__.py"
            exit 1
          fi
          FW_DIR="dist/tbc-tools.app/Contents/Frameworks"
          resolve_bundled_dep_path() {
            local dep="$1"
            case "$dep" in
              /System/*|/usr/lib/*|dynamically\ looked\ up|flat\ namespace)
                return 1
                ;;
            esac
            if [[ "$dep" == @rpath/* ]]; then
              local rel="${dep#@rpath/}"
              if [ -f "$FW_DIR/$rel" ]; then
                echo "$FW_DIR/$rel"
                return 0
              fi
            fi
            local base
            base=$(basename "$dep")
            local found
            found=$(find "$FW_DIR" -type f -name "$base" -print -quit 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "$found"
              return 0
            fi
            return 1
          }
          verify_bundled_dependencies() {
            local failures=0
            while IFS= read -r -d '' macho_file; do
              if ! file "$macho_file" 2>/dev/null | grep -q "Mach-O"; then
                continue
              fi
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                case "$dep" in
                  /System/*|/usr/lib/*|/Library/Frameworks/*)
                    continue
                    ;;
                  @*|/*)
                    ;;
                  *)
                    # otool prints "dynamically looked up" / "flat namespace"
                    # entries that awk '{print $1}' truncates to single tokens.
                    # Anything not starting with / or @ is one of those.
                    continue
                    ;;
                esac
                if ! resolve_bundled_dep_path "$dep" >/dev/null 2>&1; then
                  echo "Unresolved bundled dependency:"
                  echo "  Required by: $macho_file"
                  echo "  Declared dependency: $dep"
                  failures=1
                fi
              done < <(otool -L "$macho_file" 2>/dev/null | tail -n +2 | awk '{print $1}')
            done < <(find dist/tbc-tools.app/Contents -type f -print0)
            if [ "$failures" -ne 0 ]; then
              echo "Bundled dependency verification failed."
              return 1
            fi
            echo "Bundled dependency verification passed."
            return 0
          }
          if ! verify_bundled_dependencies; then
            exit 1
          fi
          for tool in ffmpeg ffprobe; do
            tool_path="dist/tbc-tools.app/Contents/MacOS/$tool"
            if [ ! -x "$tool_path" ]; then
              echo "Missing bundled $tool binary: $tool_path"
              exit 1
            fi
            tool_archs="$(lipo -archs "$tool_path" 2>/dev/null || true)"
            if [ -z "$tool_archs" ]; then
              echo "Unable to read architecture for bundled $tool"
              file "$tool_path" || true
              exit 1
            fi
            echo "Bundled $tool architecture: $tool_archs"
            echo "$tool_archs" | grep -qw arm64 || {
              echo "Expected $tool to include architecture arm64, got: $tool_archs"
              exit 1
            }
            if ! "$tool_path" -hide_banner -version >"/tmp/$tool-version.log" 2>&1; then
              echo "Bundled $tool failed launch smoke test."
              sed -n '1,80p' "/tmp/$tool-version.log" || true
              exit 1
            fi
          done
          export PYTHONDONTWRITEBYTECODE=1
          if ! dist/tbc-tools.app/Contents/MacOS/tbc-video-export --version >/tmp/tbc-video-export-version.log 2>&1; then
            echo "Vendored exporter tool failed launch smoke test."
            sed -n '1,80p' /tmp/tbc-video-export-version.log || true
            exit 1
          fi
          if find dist/tbc-tools.app/Contents -type d -name "__pycache__" -not -path "*/Resources/python/*" | grep -q .; then
            echo "Bytecode caches were generated inside signed app payload."
            find dist/tbc-tools.app/Contents -type d -name "__pycache__" -not -path "*/Resources/python/*"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=2 "dist/tbc-tools.app"; then
            echo "Codesign verification failed after vendored exporter smoke test."
            exit 1
          fi
          echo "\nMain executable dependencies:"
          otool -L dist/tbc-tools.app/Contents/MacOS/tbc-analyse 2>/dev/null | head -10 || echo "Could not check dependencies"
          echo "\nMain executable rpaths:"
          otool -l dist/tbc-tools.app/Contents/MacOS/tbc-analyse | grep -A2 LC_RPATH || true
          if ! otool -l dist/tbc-tools.app/Contents/MacOS/tbc-analyse | grep -q LC_RPATH; then
            echo "No LC_RPATH entries found in tbc-analyse"
            exit 1
          fi
          echo "\nScanning for /nix/store references:"
          FOUND=0
          while IFS= read -r -d '' f; do
            if file "$f" 2>/dev/null | grep -q "Mach-O"; then
              if otool -L "$f" 2>/dev/null | grep -q "/nix/store"; then
                echo "Nix load refs in: $f"
                FOUND=1
              fi
              if otool -l "$f" 2>/dev/null | grep -q "/nix/store"; then
                echo "Nix rpath refs in: $f"
                FOUND=1
              fi
            fi
          done < <(find dist/tbc-tools.app -type f -print0)
          if [ "$FOUND" -ne 0 ]; then
            echo "Found /nix/store references in app bundle"
            exit 1
          fi

      - name: Create DMG
        run: |
          create-dmg \
            --volname "TBC Tools ${{ steps.version.outputs.version }}" \
            --volicon "dist/tbc-tools.app/Contents/Resources/tbc-tools.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "tbc-tools.app" 200 190 \
            --hide-extension "tbc-tools.app" \
            --app-drop-link 600 190 \
            --skip-jenkins \
            --format UDBZ \
            "tbc-tools_arm64.dmg" \
            "dist/tbc-tools.app"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          # Named for the full source tree, so the deploy's plan job can find a
          # build of exactly this source by name.
          name: selfhosted_tbc-tools_macos_arm64-${{ env.SOURCE_TREE }}
          path: tbc-tools_arm64.dmg
          if-no-files-found: error
          retention-days: 7
