name: "Self-hosted macOS build (air0)"

# Fork-exclusive. PR check: build tbc-tools on air0 (arm64) and run its tests.
#
# `nix build .#` compiles tbc-tools and runs ctest inside the build (flake.nix
# doCheck), so the tested binaries are exactly the ones air0 installs: the
# deploy upgrades air0's profile from this same flake (self-hosted-deploy.yml),
# never from a packaged .app. Nothing is packaged here.
#
# air0 is on macOS 26. The hosted build_macos_tools.yml pins macos-15 because
# the flake.lock-pinned nixpkgs Qt uic SIGTRAPs on macOS 26 during CMake
# AUTOUIC on GitHub's image; it does not reproduce on air0. sw_vers is printed
# first so a regression is visible at the top of the log.

on:
  # Path-gated: a PR touching none of these produces no run. The list is
  # gdh_version.py's SHIPPED_PATHS plus this file (ci/gdh/check_ci.py keeps
  # them equal), so what is tested here is exactly what releases on merge.
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/self-hosted-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One build per PR at a time; a newer push supersedes the older build.
  group: tbc-tools-air0-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test tbc-tools (arm64, air0-test)
    # air0's dedicated test runner: registered with --no-default-labels, so its
    # only labels are self-hosted and air0-test and no generic macOS job can
    # land on it.
    runs-on: [self-hosted, air0-test]
    timeout-minutes: 90
    # A forked PR must never execute on a workstation: this repository is
    # public.
    if: >-
      ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Report host and toolchain
        run: |
          sw_vers
          uname -m
          nix --version
          xcode-select -p

      - uses: actions/checkout@v7
        # Shallow, no tags, no submodules: the Nix build reads only the tree,
        # and a depth-1 checkout evaluates to the same derivation as a full
        # one. Full history is 6.8 GB -- a fresh workspace spent 40 minutes
        # cloning it at air0's download rate.
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          submodules: false

      - name: Build and test with Nix
        # ctest runs inside this build (flake.nix: doCheck), serially, and a
        # failing test fails the build.
        #
        # determinate-nixd's automatic GC runs every two hours on air0, and
        # under disk pressure sooner, and deletes any store path without a GC
        # root -- mid-build if need be. On 2026-09-15 (PR #30) it deleted the
        # dev shell's scipy, matplotlib, tqdm and pyzmq 58 s before the
        # teletext test ran; on 2026-09-28 (PR #43), with the disk 95% full, it
        # deleted nixpkgs' unpacked source while `nix build .#` was evaluating
        # it. So every flake input source gets an indirect root before
        # evaluation starts, and the result gets one via --out-link. The roots
        # are named for this run, so another run cannot remove them, and are
        # pruned after a day.
        run: |
          set -euo pipefail
          ROOTS="$HOME/Library/Caches/tbc-tools-selfhosted/gcroots"
          mkdir -p "$ROOTS"
          find "$ROOTS" -maxdepth 1 \( -name 'result-*' -o -name 'flake-input-*-*' \) -mtime +1 -print -delete
          n=0
          for path in $(nix flake archive --json | grep -o '"path":"[^"]*"' | cut -d'"' -f4); do
            nix-store --add-root "$ROOTS/flake-input-$GITHUB_RUN_ID-$n" --realise "$path" > /dev/null
            n=$((n + 1))
          done
          echo "Rooted $n flake input sources"
          nix build .# --out-link "$ROOTS/result-$GITHUB_RUN_ID" -L
