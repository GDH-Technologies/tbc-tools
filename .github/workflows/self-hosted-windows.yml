name: "Self-hosted Windows build (win0-test)"

# Fork-exclusive. Native x86_64 build, test and packaging on the GDH WIN-NODE-0
# box.
#
# Not a copy of build_windows_tools.yml: that file is shared with
# harrypm/tbc-tools and must stay byte-identical so upstream merges never
# conflict. What it does is ported here; how it does it differs, because win0
# is not a GitHub image and because the hosted job's biggest cost is avoidable.
#
# The cost. Measured on the hosted job, ~all the wall clock is vcpkg compiling
# dependencies -- and most of that is qtbase, which drags in icu, harfbuzz,
# freetype, libpng, brotli, pcre2, zstd, double-conversion and openssl. So Qt
# does not come from vcpkg here: it comes prebuilt from the Qt project via
# aqtinstall, pinned to 6.12.0, the version the flake gives the Linux and macOS
# builds. (The hosted job's vcpkg baseline still builds 6.8.3; the code has to
# compile on both.) vcpkg is left with fftw3,
# libflac, ffmpeg and sqlite3, in classic mode so the shared vcpkg.json -- which
# still lists Qt for the hosted job -- is untouched.
#
# Prebuilt Qt also brings windeployqt, which resolves the Qt DLLs and plugins a
# binary actually needs. That replaces the hosted job's hand-rolled plugin copy.
# CMakeLists.txt already supports this layout: stage_windows_qt_platform_runtime
# falls back from the vcpkg <prefix>/Qt6/plugins layout to Qt::Core's imported
# location, which is where an official Qt keeps its plugins.
#
# It runs on win0-test, win0's dedicated test runner, so the main win0 runner
# stays free for the deploy's install and for other repositories. Two uses, one
# job: a PR builds and tests; a release (self-hosted-deploy.yml, `package:
# true`) also packages and uploads the zip that win0 then installs.
#
# The rest is dictated by what win0 actually is:
#
#   * It is nearly bare. Its one Visual Studio is VS 2026 Community (v18,
#     MSVC 14.5x, toolset v145), installed by hand on 2026-11-24 in place of
#     the VS 2022 Build Tools this workflow used to install. `cmake` and
#     `ninja` resolve to msys64/mingw64 builds, and `python` is the Microsoft
#     Store redirector stub. This workflow finds the VS 2026 toolset (or
#     installs the VS 2026 Build Tools if there is none) and shadows its own
#     CMake, vcpkg tool, Python and Qt.
#   * Everything it bootstraps lives in C:\ci-tools, OUTSIDE the workspace,
#     because actions/checkout runs `git clean -ffdx`. That is also why the
#     hosted job's `.\vcpkg` clone location cannot be reused.
#   * No actions/cache. The disk persists, so the vcpkg binary cache is just a
#     directory on the box. None of the hosted job's cross-repo cache machinery
#     comes along -- no checkout of the upstream CI cache repository, no chunked
#     archive reassembly, no cache-repo token. This fork does not own that
#     repository, and this workflow needs no secret beyond the default token.
#   * x86_64 only: win0 is x64, so the hosted arm64 matrix leg goes away, and
#     with it the gas-preprocessor.pl pre-fetch that only arm64 ffmpeg needs.
#   * -DBUILD_TESTING=ON (hosted uses OFF) so ctest runs. The POSIX shell tests
#     are excluded and the test binaries are filtered out of the release copy.

on:
  # Path-gated: a PR touching none of these produces no run. The list is
  # gdh_version.py's SHIPPED_PATHS plus this file (ci/gdh/check_ci.py keeps
  # them equal), so what is tested here is exactly what releases on merge.
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/self-hosted-windows.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "The commit to build (the release commit)"
        required: true
        type: string
      package:
        description: "Also package and upload the zip win0 installs"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # What serialises tbc-tools' Windows builds is that only the win0-test
  # runner takes them. github.workflow resolves to the CALLER's name under
  # workflow_call, so a release build lands in its own group and is never
  # cancelled by a PR run; only PR runs cancel their superseded build.
  group: tbc-tools-win0-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOOLS_ROOT: 'C:\ci-tools'
  VCPKG_ROOT: 'C:\ci-tools\vcpkg'
  VCPKG_BINARY_CACHE_DIR: 'C:\ci-tools\vcpkg-binary-cache\x64-windows'
  VCPKG_COMMIT: "d30fdf55cfca16e12bc3ad99cbc615997014b61b"
  VCPKG_TRIPLET: "x64-windows"
  # The vcpkg tool (vcpkg.exe), pinned apart from the ports tree. VCPKG_COMMIT's
  # own tool (2025-07-21) predates VS 2026: it reads MSVC 14.5x as an unknown
  # toolset and fails every build with "Unable to find a valid Visual Studio
  # instance". v145 support landed in microsoft/vcpkg-tool#1787; 2025-10-10 is
  # the first release with it. Only the tool moves: the ports, and so the
  # package versions, stay at VCPKG_COMMIT, the shared vcpkg.json's baseline.
  VCPKG_TOOL_RELEASE: "2025-10-10"
  VCPKG_TOOL_SHA256: "00b330797d31e8a30a995aa69b28fc33cfd9c0b33e51a6139e31db9fcd32e02a"
  # The Visual Studio major version this workflow builds with, as a vswhere
  # -version range, and the CMake generator that drives it. They move together:
  # a generator CMake does not know makes it fall back to NMake, which then
  # rejects the preset's x64 architecture.
  VS_VERSION_RANGE: "[18.0,19.0)"
  CMAKE_GENERATOR_NAME: "Visual Studio 18 2026"
  # Everything vcpkg still builds here. Qt is deliberately absent -- see the
  # header. Keep this in step with the non-Qt entries of the shared vcpkg.json.
  VCPKG_PACKAGES: "fftw3 libflac ffmpeg sqlite3"
  # The version the flake's locked nixpkgs gives the Linux and macOS builds, so
  # every GDH platform runs the same Qt. Fork-owned: the hosted job's vcpkg
  # baseline (ports/qtbase 6.8.3) is upstream's and is left alone.
  QT_VERSION: "6.12.0"
  # Qt 6.12 ships x64 MSVC binaries only as msvc2022_64. VS 2026's MSVC 14.5x
  # is binary-compatible with them (the v14x ABI holds from VS 2015 on, and the
  # linking toolset is the newer one), so they link as they are.
  QT_ARCH: "win64_msvc2022_64"
  QT_DIR_NAME: "msvc2022_64"
  # aqtinstall 3.3.0, the latest release, cannot install Qt 6.12: it looks for
  # qt6_6120/qt6_6120/Updates.xml, but from 6.11 the Windows x64 builds live in
  # one directory per architecture (qt6_6120/qt6_6120_msvc2022_64/). Its master
  # handles that (Qt 6.11+ Windows x64, and 6.12's versioned extensions from
  # miurahr/aqtinstall#1048). Pinned to that commit until a release has it.
  AQTINSTALL_SPEC: "aqtinstall @ git+https://github.com/miurahr/aqtinstall@4c759852b1108cc801d8e24979136b895b5155d4"
  # CMake 4.x: the "Visual Studio 18 2026" generator needs CMake 4.2 or later.
  # Same minor as the flake's (cmake 4.4.4). This CMake only configures and
  # builds tbc-tools itself; vcpkg builds its ports with the CMake that
  # VCPKG_COMMIT's scripts/vcpkg-tools.json pins (3.30.1), so the fftw3 port's
  # CMake 3.x requirement, the reason for the old 3.31.6 pin, is not touched.
  CMAKE_VERSION: "4.4.5"
  PYTHON_VERSION: "3.11.9"
  ONNXRUNTIME_VERSION: "1.18.1"
  FFMPEG_PATH: "ffmpeg-8.0.1-full_build"
  FFMPEG_URL: "https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-full_build.zip"
  FLAC_PATH: "flac-1.5.0-win"
  FLAC_URL: "https://ftp.osuosl.org/pub/xiph/releases/flac/flac-1.5.0-win.zip"

jobs:
  build:
    name: Build, test and package tbc-tools (x86_64, win0-test)
    # win0's dedicated test runner: registered with --no-default-labels, so its
    # only labels are self-hosted and win0-test. Same box and account as win0,
    # so C:\ci-tools and its caches are shared.
    runs-on: [self-hosted, win0-test]
    # An incremental build is 2-8 minutes; a cold vcpkg rebuild of fftw3,
    # libflac, ffmpeg and sqlite3 fits well inside this.
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    # A forked PR must never execute on a workstation: this repository is
    # public.
    if: >-
      ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Prepare persistent tool root
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($d in @($env:TOOLS_ROOT,
                           "$env:TOOLS_ROOT\downloads",
                           "$env:TOOLS_ROOT\external",
                           $env:VCPKG_BINARY_CACHE_DIR)) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }
          Get-PSDrive C | Format-List Name,Used,Free

      - name: Ensure MSVC build tools
        # Find a VS 2026 (VS_VERSION_RANGE) instance with the x64 toolset and
        # the CRT redist. win0's is VS 2026 Community; any edition, Build Tools
        # included, will do. If there is none, install the VS 2026 Build Tools
        # once (the runner service is elevated); every later run finds them and
        # this is a no-op. The range matters: an unbounded `-latest` would hand
        # a newer or older Visual Studio to a generator (CMAKE_GENERATOR_NAME)
        # that cannot drive it. No developer command prompt shim is needed:
        # Configure names the generator and this instance, and CMake locates
        # the toolset itself.
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $requires = @(
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
            # Needed by "Copy MSVC runtime DLLs" below, which pulls the CRT out
            # of the redist tree rather than assuming the end user has the VC++
            # redistributable installed.
            "Microsoft.VisualStudio.Component.VC.Redist.14.Latest"
          )
          function Find-VS {
            if (-not (Test-Path $vswhere)) { return $null }
            & $vswhere -latest -products * -version $env:VS_VERSION_RANGE `
              -requires $requires -property installationPath
          }
          $vs = Find-VS
          if (-not $vs) {
            Write-Host "No VS $env:VS_VERSION_RANGE with the MSVC x64 toolset found; installing VS 2026 Build Tools."
            $bootstrap = "$env:TOOLS_ROOT\downloads\vs2026_BuildTools.exe"
            if (-not (Test-Path $bootstrap)) {
              # VS 2026 publishes on "stable" (VS 2022 used "release").
              Invoke-WebRequest "https://aka.ms/vs/18/stable/vs_buildtools.exe" -OutFile $bootstrap
            }
            $p = Start-Process -FilePath $bootstrap -Wait -PassThru -ArgumentList (@(
              "--quiet", "--wait", "--norestart", "--nocache",
              "--add", "Microsoft.VisualStudio.Workload.VCTools",
              "--add", "Microsoft.VisualStudio.Component.Windows11SDK.26100"
            ) + ($requires | ForEach-Object { "--add", $_ }))
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "VS Build Tools install failed with exit code $($p.ExitCode)"
            }
            if (-not (Test-Path $vswhere)) { throw "vswhere.exe still missing after install" }
            $vs = Find-VS
          }
          if (-not $vs) {
            throw "No VS $env:VS_VERSION_RANGE with the MSVC x64 toolset on win0. Install the VS 2026 Build Tools manually and re-run."
          }
          Write-Host "Using Visual Studio at: $vs"
          "VS_INSTALL_PATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The vcpkg tool picks a Visual Studio on its own; point it at this one
          # so the ports and tbc-tools build with the same toolset.
          "VCPKG_VISUAL_STUDIO_PATH=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure pinned CMake
        # win0's `cmake` on PATH is msys64/mingw64's. Prepend our own pinned
        # build, one recent enough to know CMAKE_GENERATOR_NAME. A version bump
        # unpacks beside the old one; the old directory is left for removal by
        # hand.
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:TOOLS_ROOT\cmake-$env:CMAKE_VERSION-windows-x86_64"
          if (-not (Test-Path "$dir\bin\cmake.exe")) {
            $zip = "$env:TOOLS_ROOT\downloads\cmake-$env:CMAKE_VERSION-windows-x86_64.zip"
            if (-not (Test-Path $zip)) {
              Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v$env:CMAKE_VERSION/cmake-$env:CMAKE_VERSION-windows-x86_64.zip" -OutFile $zip
            }
            Expand-Archive -Path $zip -DestinationPath $env:TOOLS_ROOT -Force
          }
          if (-not (Test-Path "$dir\bin\cmake.exe")) {
            throw "CMake bootstrap did not produce $dir\bin\cmake.exe"
          }
          # Fail here, not at configure's fallback to NMake, if this CMake does
          # not know the generator.
          $help = (& "$dir\bin\cmake.exe" --help | Out-String)
          if (-not $help.Contains($env:CMAKE_GENERATOR_NAME)) {
            throw "CMake $env:CMAKE_VERSION has no '$env:CMAKE_GENERATOR_NAME' generator"
          }
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure pinned Python
        # win0's `python` is the Microsoft Store redirector stub, which opens
        # the Store instead of running. Per-user install, no admin needed.
        run: |
          $ErrorActionPreference = 'Stop'
          $py = "$env:TOOLS_ROOT\python311"
          if (-not (Test-Path "$py\python.exe")) {
            $exe = "$env:TOOLS_ROOT\downloads\python-$env:PYTHON_VERSION-amd64.exe"
            if (-not (Test-Path $exe)) {
              Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-amd64.exe" -OutFile $exe
            }
            $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
              "/quiet", "InstallAllUsers=0", "PrependPath=0", "Include_test=0",
              "Include_launcher=0", "TargetDir=$py")
            if ($p.ExitCode -ne 0) { throw "Python install failed with exit code $($p.ExitCode)" }
          }
          if (-not (Test-Path "$py\python.exe")) {
            throw "Python bootstrap did not produce $py\python.exe"
          }
          $py           | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$py\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure prebuilt Qt
        # The whole point of the refactor. Compiling qtbase from source under
        # vcpkg is the dominant cost of a cold Windows build -- it pulls in icu,
        # harfbuzz, freetype, libpng, brotli, pcre2, zstd, double-conversion and
        # openssl behind it. The Qt project ships binaries for exactly this
        # toolchain; take those instead, pinned (QT_VERSION) to the Qt the
        # flake gives the Linux and macOS builds.
        #
        # qtbase covers Core, Gui, Widgets, Sql and Network; qtsvg is the one
        # extra module CMakeLists.txt asks for.
        #
        # A Qt installed by hand is used as-is rather than duplicated, so the
        # official installer's default location works as well as ours. Set
        # TBC_QT_DIR on the runner to point somewhere else entirely; otherwise
        # the candidates below are probed in order and aqt only runs if none
        # of them holds a usable Qt of the pinned version.
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = "$env:TOOLS_ROOT\Qt"
          $candidates = @()
          if ($env:TBC_QT_DIR) { $candidates += $env:TBC_QT_DIR }
          $candidates += @(
            "$qtRoot\$env:QT_VERSION\$env:QT_DIR_NAME",
            "C:\Qt\$env:QT_VERSION\$env:QT_DIR_NAME"
          )
          $qtDir = $candidates | Where-Object { Test-Path "$_\bin\windeployqt.exe" } | Select-Object -First 1
          if ($qtDir) {
            Write-Host "Found an existing Qt at $qtDir"
          } else {
            Write-Host "No Qt $env:QT_VERSION found in: $($candidates -join '; ')"
            # AQTINSTALL_SPEC, not the latest release: see its comment.
            python -m pip install --upgrade $env:AQTINSTALL_SPEC
            if ($LASTEXITCODE -ne 0) { throw "aqtinstall install failed" }
            # No `-m qtsvg`: in Qt 6.8, 6.10 and 6.12 Svg is not an optional
            # module, it is an archive inside the base package, and asking for
            # it as a module fails with "The packages ['qtsvg'] were not found".
            # Confirmed against `aqt list-qt windows desktop --archives 6.10.1
            # win64_msvc2022_64`, which lists qtbase, qtsvg, qttools,
            # qtdeclarative, qttranslations, d3dcompiler_47 and opengl32sw
            # (the same set 6.8.3 had). 6.12.0's qt.qt6.6120.win64_msvc2022_64
            # package in download.qt.io's Updates.xml lists the same set plus
            # qtdoc (checked 2026-11-26). 6.12 moved each architecture into its
            # own repository directory (qt6_6120/qt6_6120_msvc2022_64/).
            #
            # Take only the three that are needed -- qtbase for Core/Gui/
            # Widgets/Sql/Network, qtsvg for Svg, qttools for windeployqt --
            # and skip the rest. Nothing here uses QML, and the deploy call
            # passes --no-system-d3d-compiler --no-opengl-sw, so d3dcompiler_47
            # and opengl32sw would never be shipped anyway.
            python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH `
              --archives qtbase qtsvg qttools -O $qtRoot
            if ($LASTEXITCODE -ne 0) { throw "aqt install-qt failed" }
            $qtDir = "$qtRoot\$env:QT_VERSION\$env:QT_DIR_NAME"
          }
          foreach ($probe in @("$qtDir\bin\windeployqt.exe",
                               "$qtDir\bin\Qt6Core.dll",
                               "$qtDir\bin\Qt6Svg.dll",
                               "$qtDir\plugins\platforms\qwindows.dll",
                               "$qtDir\plugins\sqldrivers\qsqlite.dll")) {
            if (-not (Test-Path $probe)) { throw "Qt install incomplete: missing $probe" }
          }
          Write-Host "Using Qt $env:QT_VERSION at $qtDir"
          "QT_DIR=$qtDir"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Putting Qt's bin on PATH is load-bearing for ctest, not just for
          # finding windeployqt later. Qt is no longer a vcpkg package, so
          # VCPKG_APPLOCAL_DEPS does not drop Qt6Core.dll beside the binaries in
          # $BUILD_DIR\bin, and CMakeLists.txt's stage_windows_qt_platform_runtime
          # stages only plugins and qt.conf there -- not the Qt DLLs. Without
          # this line every test binary fails to start.
          "$qtDir\bin"      | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Reset stale build output
        run: |
          Remove-Item -Recurse -Force build, release -ErrorAction SilentlyContinue

      - uses: actions/checkout@v7
        # Full history and tags -- git describe and gdh_version.py need them --
        # but a partial clone: file contents only for what is checked out. A
        # fresh runner's full clone is 6.8 GB of mostly old blobs (40 minutes
        # on air0's link). A release build checks out the release commit.
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          submodules: true
          ref: ${{ inputs.ref || github.sha }}

      - name: Refresh tags
        # If the workspace persisted, a tag deleted or moved on the remote can
        # linger locally and poison `git describe`. That matters more here than
        # anywhere else: this is the platform whose SHIPPED build sees .git, so
        # CMakeLists.txt resolves APP_VERSION from git -- the release tag on a
        # release commit. The Nix-built Linux and macOS installs read the same
        # version from the committed .gdh-version.
        run: git fetch --tags --prune --prune-tags --force origin

      - name: Report toolchain and version
        run: |
          cmake --version
          python --version
          Write-Host "Qt: $env:QT_DIR"
          git describe --tags --long --abbrev=8 --match "v*-gdh-*" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "no gdh tag in range yet" }
          $global:LASTEXITCODE = 0
          Write-Host "gdh version: $(python scripts\gdh_version.py show)"

      - name: Install Python build requirements
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -r "$env:GITHUB_WORKSPACE\src\tbc-video-export\pyinstaller\requirements-build-windows.txt"
          python -c "import pywintypes, win32file, win32pipe"

      - name: Ensure vcpkg at the pinned commit
        # Cloned into C:\ci-tools, not the workspace: checkout's git clean would
        # otherwise delete the whole tree (and its downloads/installed caches)
        # on every run. The -e exclusions keep those caches across a
        # VCPKG_COMMIT bump.
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          }
          git -C $env:VCPKG_ROOT fetch --tags --force origin
          git -C $env:VCPKG_ROOT checkout --force $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT clean -ffdx -e downloads -e installed -e packages -e buildtrees
          # The tool comes from VCPKG_TOOL_RELEASE, not bootstrap-vcpkg.bat,
          # which would fetch VCPKG_COMMIT's VS 2026-blind tool (see the env
          # block). The clean above removes vcpkg.exe, so it is copied in on
          # every run from a hash-checked download kept outside the tree.
          $toolDir = "$env:TOOLS_ROOT\downloads\vcpkg-tool-$env:VCPKG_TOOL_RELEASE"
          $toolExe = "$toolDir\vcpkg.exe"
          if (-not (Test-Path $toolExe) -or
              (Get-FileHash -Algorithm SHA256 $toolExe).Hash -ne $env:VCPKG_TOOL_SHA256) {
            New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
            Invoke-WebRequest "https://github.com/microsoft/vcpkg-tool/releases/download/$env:VCPKG_TOOL_RELEASE/vcpkg.exe" -OutFile $toolExe
          }
          $hash = (Get-FileHash -Algorithm SHA256 $toolExe).Hash
          if ($hash -ne $env:VCPKG_TOOL_SHA256) {
            Remove-Item -Force $toolExe
            throw "vcpkg tool $env:VCPKG_TOOL_RELEASE has SHA256 $hash, expected $env:VCPKG_TOOL_SHA256"
          }
          Copy-Item -Path $toolExe -Destination "$env:VCPKG_ROOT\vcpkg.exe" -Force
          # What bootstrap-vcpkg.bat -disableMetrics would have left.
          New-Item -ItemType File -Force -Path "$env:VCPKG_ROOT\vcpkg.disable-metrics" | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          if ($LASTEXITCODE -ne 0) { throw "vcpkg.exe does not run" }
          # A plain directory on the persistent disk replaces both the hosted
          # job's actions/cache and its cross-repo cache checkout.
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE_DIR,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install vcpkg dependencies (classic mode, no Qt)
        # Classic mode rather than the shared manifest: vcpkg.json lists Qt
        # because the hosted job needs it there, and that file must stay
        # byte-identical for upstream merges. Naming the packages here takes Qt
        # out of the picture without touching it. Still fully pinned -- the
        # vcpkg checkout is at VCPKG_COMMIT, so these resolve to the same
        # versions the manifest baseline would have used.
        #
        # Run it from outside the checkout. vcpkg picks manifest mode purely
        # from finding a vcpkg.json in the working directory, and then refuses
        # package arguments outright: "In manifest mode, `vcpkg install` does
        # not support individual package arguments." C:\ci-tools has no
        # manifest, so the same command is classic mode there. Classic mode
        # installs into $VCPKG_ROOT\installed\<triplet>, which is also where
        # the toolchain looks once VCPKG_MANIFEST_MODE=OFF.
        run: |
          $ErrorActionPreference = 'Stop'
          $pkgs = $env:VCPKG_PACKAGES -split '\s+' | Where-Object { $_ }
          Write-Host "vcpkg install $($pkgs -join ' ') --triplet=$env:VCPKG_TRIPLET (from $env:TOOLS_ROOT)"
          Push-Location $env:TOOLS_ROOT
          try {
            # Classic mode skips packages that are already installed, so a warm
            # box never compiles a port and a vcpkg that cannot find the
            # toolset would go unnoticed until the next cache miss. Make the
            # tool set up the triplet's build environment every run instead.
            & "$env:VCPKG_ROOT\vcpkg.exe" env "--triplet=$env:VCPKG_TRIPLET" "where cl.exe"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg cannot set up an MSVC environment for $env:VCPKG_TRIPLET" }
            & "$env:VCPKG_ROOT\vcpkg.exe" install @pkgs "--triplet=$env:VCPKG_TRIPLET"
            $rc = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($rc -ne 0) { throw "vcpkg install failed" }
          $installed = "$env:VCPKG_ROOT\installed\$env:VCPKG_TRIPLET"
          if (-not (Test-Path "$installed\bin\sqlite3.dll")) {
            throw "vcpkg install did not produce $installed\bin\sqlite3.dll"
          }
          "VCPKG_INSTALLED=$installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure ONNX Runtime
        run: |
          $ErrorActionPreference = 'Stop'
          # Microsoft purged the onnxruntime GitHub releases on 2026-11-20, so
          # ORT comes from the immutable nuget.org package, as upstream's
          # build_windows_tools.yml does. The nupkg keeps headers and natives
          # under buildTransitive/ and runtimes/; arrange them into the
          # include/ + lib/ tree ONNXRUNTIME_ROOT expects. The directory name
          # is new, so a cache left from the GitHub zip is never reused.
          $nupkg = "Microsoft.ML.OnnxRuntime.Gpu.Windows"
          $extractRoot = "$env:TOOLS_ROOT\external\onnxruntime"
          $onnxRoot = Join-Path $extractRoot "onnxruntime-win-x64-gpu-nuget-$env:ONNXRUNTIME_VERSION"
          if (-not (Test-Path "$onnxRoot\include\onnxruntime_cxx_api.h")) {
            $nupkgRoot = Join-Path $extractRoot "$nupkg.$env:ONNXRUNTIME_VERSION"
            New-Item -ItemType Directory -Force -Path $nupkgRoot | Out-Null
            $archivePath = Join-Path $extractRoot "$nupkg.$env:ONNXRUNTIME_VERSION.nupkg.zip"
            if (-not (Test-Path $archivePath)) {
              Invoke-WebRequest "https://www.nuget.org/api/v2/package/$nupkg/$env:ONNXRUNTIME_VERSION" -OutFile $archivePath
            }
            Expand-Archive -Path $archivePath -DestinationPath $nupkgRoot -Force
            New-Item -ItemType Directory -Force -Path "$onnxRoot\include", "$onnxRoot\lib" | Out-Null
            Copy-Item -Path "$nupkgRoot\buildTransitive\native\include\*" -Destination "$onnxRoot\include" -Recurse -Force
            Copy-Item -Path "$nupkgRoot\runtimes\win-x64\native\*" -Destination "$onnxRoot\lib" -Recurse -Force
            Copy-Item -Path "$nupkgRoot\LICENSE" -Destination $onnxRoot -Force
          }
          if (-not (Test-Path "$onnxRoot\lib\onnxruntime.lib")) {
            throw "ONNX Runtime import library not found in $onnxRoot\lib"
          }
          "ONNXRUNTIME_ROOT=$onnxRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure FFmpeg and FLAC payloads
        # The bundled ffmpeg.exe/ffprobe.exe end users invoke, distinct from the
        # vcpkg ffmpeg the code links against.
        run: |
          $ErrorActionPreference = 'Stop'
          $ext = "$env:TOOLS_ROOT\external"
          $ffmpegDir = Join-Path $ext $env:FFMPEG_PATH
          if (-not (Test-Path "$ffmpegDir\bin\ffmpeg.exe")) {
            $zip = "$env:TOOLS_ROOT\downloads\ffmpeg.zip"
            if (-not (Test-Path $zip)) { Invoke-WebRequest $env:FFMPEG_URL -OutFile $zip }
            Expand-Archive -Path $zip -DestinationPath $ext -Force
          }
          if (-not (Test-Path "$ffmpegDir\bin\ffmpeg.exe")) { throw "FFmpeg payload missing at $ffmpegDir" }
          $flacDir = Join-Path $ext $env:FLAC_PATH
          if (-not (Test-Path "$flacDir\Win64")) {
            $zip = "$env:TOOLS_ROOT\downloads\flac.zip"
            if (-not (Test-Path $zip)) { Invoke-WebRequest $env:FLAC_URL -OutFile $zip }
            Expand-Archive -Path $zip -DestinationPath $ext -Force
          }
          if (-not (Test-Path "$flacDir\Win64")) { throw "FLAC payload missing at $flacDir" }
          "FFMPEG_DIR=$ffmpegDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FLAC_DIR=$flacDir"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Choose the persistent build directory
        # The build directory is kept outside the workspace, which checkout's
        # `git clean -ffdx` wipes, so MSBuild builds incrementally across runs
        # instead of from scratch. It is keyed on everything that would make old
        # objects unusable or the cache inconsistent: the Qt, vcpkg, CMake and
        # MSVC toolset versions, plus the workspace path that CMakeCache.txt
        # records. So a toolchain bump starts a fresh directory instead of mixing
        # ABIs, and each runner's workspace gets its own. Each run marks its
        # directory as in use; other keys are removed once unused for a day, so
        # a run on the other runner of this box (win0 and win0-test share
        # C:\ci-tools) never has its directory deleted mid-build.
        run: |
          $ErrorActionPreference = 'Stop'
          $toolsetFile = Join-Path $env:VS_INSTALL_PATH 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
          if (-not (Test-Path $toolsetFile)) { throw "MSVC toolset version file missing: $toolsetFile" }
          $msvc = (Get-Content $toolsetFile -Raw).Trim()
          $keyText = "qt=$env:QT_VERSION;vcpkg=$env:VCPKG_COMMIT;cmake=$env:CMAKE_VERSION;msvc=$msvc;src=$env:GITHUB_WORKSPACE"
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hash = ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($keyText)) | ForEach-Object { $_.ToString('x2') }) -join ''
          $root = Join-Path $env:TOOLS_ROOT 'build'
          $dir  = Join-Path $root $hash.Substring(0, 16)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          (Get-Item $dir).LastWriteTime = Get-Date
          $cutoff = (Get-Date).AddDays(-1)
          Get-ChildItem -Path $root -Directory | Where-Object { $_.FullName -ne $dir -and $_.LastWriteTime -lt $cutoff } | ForEach-Object {
            Write-Host "Removing stale build directory $($_.FullName)"
            Remove-Item -Recurse -Force $_.FullName
          }
          Write-Host "Build directory: $dir ($keyText)"
          "BUILD_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        # The hosted job wraps this in lukka/run-cmake@v10; calling CMake
        # directly keeps the arguments visible in the log and drops an action
        # dependency. The preset supplies the vcpkg toolchain and the x64
        # architecture, and -B overrides its in-source binaryDir with the
        # persistent directory. The extra args are what differ here:
        #   -G, CMAKE_GENERATOR_INSTANCE
        #                            -- the preset names no generator, which
        #                               lets CMake take the newest Visual Studio
        #                               it knows, or NMake if it knows none (the
        #                               2026-11-24 break). Name the generator and
        #                               the instance "Ensure MSVC build tools"
        #                               found, so CMake, vcpkg and the build
        #                               directory key all mean the same toolset.
        #                               CMakePresets.json is upstream's and stays
        #                               as it is.
        #   VCPKG_MANIFEST_MODE=OFF  -- use the classic-mode installs above
        #                               instead of the shared, Qt-bearing manifest
        #   CMAKE_PREFIX_PATH        -- find the prebuilt Qt
        #   BUILD_TESTING=ON         -- hosted uses OFF; ctest runs here
        # The triplet argument MUST be quoted. Unquoted, PowerShell parses
        # `-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET` with its `-Param:Value`
        # colon-binding syntax and hands vcpkg the literal text, which fails
        # with "Invalid triplet name ... on expression: $env:VCPKG_TRIPLET".
        run: |
          $ErrorActionPreference = 'Stop'
          # Clear the previous run's outputs, but keep its objects. Staging copies
          # every top-level $BUILD_DIR\bin\*.exe, so the old exe of a renamed or
          # removed target must not linger there to be shipped. This happens
          # before configure, because configure writes files into bin itself.
          # MSBuild then relinks every target (cheap) and recompiles only what
          # changed.
          Remove-Item -Recurse -Force (Join-Path $env:BUILD_DIR 'bin') -ErrorAction SilentlyContinue
          cmake --preset vcpkg -B "$env:BUILD_DIR" `
            -G "$env:CMAKE_GENERATOR_NAME" `
            "-DCMAKE_GENERATOR_INSTANCE=$env:VS_INSTALL_PATH" `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSE_QT_VERSION=6 `
            -DBUILD_PYTHON=false `
            -DVCPKG_MANIFEST_MODE=OFF `
            "-DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET" `
            "-DCMAKE_PREFIX_PATH=$env:QT_DIR" `
            -DVCPKG_APPLOCAL_DEPS=ON `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        env:
          # MSVC reads CL and prepends it to every cl.exe invocation, so /MP makes
          # each project compile its sources in parallel. --parallel 2 lets
          # MSBuild build two projects at once. win0 has 4 logical CPUs and 12 GB
          # of RAM, so this caps the box at 8 concurrent compilers rather than the
          # 16 that a bare --parallel (one MSBuild node per CPU) with /MP could
          # reach. Before this, the build ran on one core (about 12m47s).
          CL: /MP
        run: |
          cmake --build "$env:BUILD_DIR" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }

      - name: Verify the stamped version
        # The binary must report the version this checkout resolves, by the
        # same rule the tooling uses. The reused build directory once kept its
        # first configure's APP_VERSION in the CMake cache for good (win0 said
        # 3.2.9-gdh-2.0+10.gf41224ca long after that commit); CMakeLists.txt no
        # longer caches it, and this is the check that it stays that way.
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = (python scripts\gdh_version.py show).Trim()
          $line = (& (Join-Path $env:BUILD_DIR 'bin\tbc-chroma-decoder.exe') --version | Out-String).Trim()
          Write-Host $line
          if (-not $line.Contains("tbc-tools $expected - ")) {
            throw "tbc-chroma-decoder reports '$line'; the checkout resolves $expected"
          }

      - name: Run ctest
        # chroma-* and decode-pretbc-* are the POSIX-shell integration tests
        # registered by CMakeLists.txt; they cannot run on Windows. Every
        # remaining test is a C++ binary linking only Qt::Core + tbc-library.
        run: |
          ctest --test-dir "$env:BUILD_DIR" -C Release --output-on-failure -E "^(chroma-|decode-pretbc-)"
          if ($LASTEXITCODE -ne 0) { throw "ctest failed" }

      # Everything below packages the zip win0 installs, and runs only for a
      # release (self-hosted-deploy.yml calls this workflow with package: true).
      # A PR stops after ctest.
      - name: Stage binaries into the release directory
        if: ${{ inputs.package }}
        # Top level of $BUILD_DIR\bin only. The hosted job copies *.exe/*.dll
        # recursively, which flattens the staged Qt plugin subdirectories into
        # the release root and then has to undo that; here windeployqt lays the
        # plugins out properly a few steps down, and the vendor payloads are
        # copied as trees below. BUILD_TESTING=ON also puts the ctest binaries
        # in $BUILD_DIR\bin, and those must not ship.
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release | Out-Null
          Get-ChildItem -Path "$env:BUILD_DIR\bin\*" -Include *.exe, *.dll -File |
            Where-Object { $_.Name -notmatch '^test' } |
            Copy-Item -Destination release\
          if (-not (Test-Path 'release\tbc-analyse.exe')) {
            throw "$env:BUILD_DIR\bin did not yield tbc-analyse.exe"
          }

      - name: Deploy Qt runtime with windeployqt
        if: ${{ inputs.package }}
        # Replaces the hosted job's manual Qt plugin copy and qt.conf writer.
        # windeployqt reads a binary's imports and brings exactly the Qt DLLs
        # and plugins it needs, in the layout Qt expects relative to the exe.
        #
        # One call, against tbc-analyse: CMakeLists.txt asks Qt for Core, Gui,
        # Widgets, Sql, Svg and Network, and tbc-analyse is the binary that uses
        # all of them -- every CLI tool links a subset. Deploying the superset
        # once covers the whole tree and avoids invoking windeployqt on a
        # binary that turns out not to link Qt at all, which it treats as an
        # error.
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:QT_DIR\bin\windeployqt.exe" `
            --release --no-translations --no-system-d3d-compiler --no-opengl-sw `
            --dir release release\tbc-analyse.exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          # windeployqt places plugins relative to --dir, which Qt finds on its
          # own; qt.conf is written anyway so plugin discovery cannot fall back
          # to Qt's compiled-in prefix (which does not exist off this machine).
          Set-Content -Path release\qt.conf -Encoding ASCII -Value "[Paths]"
          Add-Content -Path release\qt.conf -Encoding ASCII -Value "Prefix = ."
          Add-Content -Path release\qt.conf -Encoding ASCII -Value "Plugins = ."

      - name: Copy AAA (Auto Audio Align) vendor payload to release directory
        if: ${{ inputs.package }}
        # audioalignmentutil.cpp resolves AAA at
        # <appDir>\vendor\vhs_decode_auto_audio_align\ for tbc-analyse and
        # tbc-audio-align, so the tree has to keep that shape.
        run: |
          $ErrorActionPreference = 'Stop'
          $vendorSrc = "$env:BUILD_DIR\bin\vendor\vhs_decode_auto_audio_align"
          $vendorDst = "release\vendor\vhs_decode_auto_audio_align"
          if (-not (Test-Path "$vendorSrc\VhsDecodeAutoAudioAlign.exe") -or -not (Test-Path "$vendorSrc\Binah.dll")) {
            throw "AAA vendor payload missing under $vendorSrc"
          }
          New-Item -ItemType Directory -Force -Path $vendorDst | Out-Null
          Copy-Item -Path "$vendorSrc\*" -Destination $vendorDst -Recurse -Force
          Write-Host "Bundled AAA vendor payload to $vendorDst"

      - name: Copy vhs-teletext vendor payload to release directory
        if: ${{ inputs.package }}
        # teletextintegration.cpp's resolveTeletextVendorDirectory() looks for
        # <appDir>\vendor\vhs-teletext and validates it by the presence of
        # teletext\__main__.py. Without it, tbc-process-vbi's --teletext-html-dir
        # export fails with "Could not locate vendored vhs-teletext runtime
        # directory."
        run: |
          $ErrorActionPreference = 'Stop'
          $vendorSrc = "$env:BUILD_DIR\bin\vendor\vhs-teletext"
          $vendorDst = "release\vendor\vhs-teletext"
          if (-not (Test-Path "$vendorSrc\teletext\__main__.py")) {
            throw "vhs-teletext vendor payload missing under $vendorSrc"
          }
          New-Item -ItemType Directory -Force -Path $vendorDst | Out-Null
          Copy-Item -Path "$vendorSrc\*" -Destination $vendorDst -Recurse -Force
          Write-Host "Bundled vhs-teletext vendor payload to $vendorDst"

      - name: Copy ONNX Runtime DLLs to release directory
        if: ${{ inputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $onnxLibDir = "$env:ONNXRUNTIME_ROOT\lib"
          if (-not (Test-Path "$onnxLibDir\onnxruntime.dll")) {
            throw "onnxruntime.dll not found at $onnxLibDir\onnxruntime.dll"
          }
          Copy-Item -Path "$onnxLibDir\onnxruntime.dll" -Destination release\
          # x86_64 ships the CUDA EP provider DLL but not the CUDA runtime it
          # imports: LoadLibrary fails and ORT falls back to the CPU EP, which is
          # the intended default-release behaviour. GPU acceleration is the
          # opt-in CUDA plugin.
          Get-ChildItem -Path $onnxLibDir -Filter "onnxruntime_providers_*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination release\

      - name: Copy MSVC runtime DLLs to release directory
        if: ${{ inputs.package }}
        # The executables import VCRUNTIME140.dll / VCRUNTIME140_1.dll and
        # MSVCP140.dll, but neither vcpkg nor windeployqt redistributes the CRT,
        # so a clean machine without the VC++ redistributable gets
        # "VCRUNTIME140.dll was not found".
        #
        # The hosted job finds these with two `Get-ChildItem -Recurse` sweeps of
        # the entire VS install -- ~40s of the run. vswhere already told us the
        # install path, and the redist lives at a known place under it, so glob
        # that directly. The CRT must be at least as new as the toolset that
        # built the binaries: bundling a VC142 CRT with VC143-built binaries
        # crashed the GUI at startup (STATUS_DLL_INIT_FAILED 0xC0000142 inside
        # MSVCP140.dll). So take the install's own default redist version, the
        # one that matches its default toolset, from
        # Microsoft.VCRedistVersion.default.txt, and its desktop (non-onecore)
        # CRT. The CRT folder carries the toolset in its name (VC145.CRT for
        # VS 2026's MSVC 14.5x, VC143.CRT for VS 2022's 14.3x/14.4x); the DLL
        # names inside stay vcruntime140/msvcp140.
        run: |
          $ErrorActionPreference = 'Stop'
          $redistFile = Join-Path $env:VS_INSTALL_PATH 'VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt'
          if (-not (Test-Path $redistFile)) { throw "MSVC redist version file missing: $redistFile" }
          $redistVersion = (Get-Content $redistFile -Raw).Trim()
          $redistGlob = Join-Path $env:VS_INSTALL_PATH "VC\Redist\MSVC\$redistVersion\x64\Microsoft.VC14*.CRT"
          $crtDir = @(Get-ChildItem -Path $redistGlob -Directory -ErrorAction SilentlyContinue)
          if ($crtDir.Count -ne 1) {
            throw "Expected one MSVC CRT redist at $redistGlob, found $($crtDir.Count)"
          }
          $crtDir = $crtDir[0]
          Write-Host "Using MSVC CRT from: $($crtDir.FullName)"
          foreach ($dll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            $src = Join-Path $crtDir.FullName $dll
            if (Test-Path $src) { Copy-Item -Path $src -Destination release\ }
            else { Write-Warning "MSVC CRT $dll not found in $($crtDir.FullName)" }
          }

      - name: Copy FFmpeg and FLAC to release directory
        if: ${{ inputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -Path "$env:FFMPEG_DIR\bin\ffmpeg.exe" -Destination release\
          if (Test-Path "$env:FFMPEG_DIR\bin\ffprobe.exe") {
            Copy-Item -Path "$env:FFMPEG_DIR\bin\ffprobe.exe" -Destination release\
          }
          # ffplay plays the Export tab's monitored audio tracks (optional)
          if (Test-Path "$env:FFMPEG_DIR\bin\ffplay.exe") {
            Copy-Item -Path "$env:FFMPEG_DIR\bin\ffplay.exe" -Destination release\
          }
          Copy-Item -Path "$env:FFMPEG_DIR\bin\*.dll" -Destination release\
          Copy-Item -Path "$env:FLAC_DIR\Win64\*" -Destination release\

      - name: Copy sqlite runtime to release directory
        if: ${{ inputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sqliteDll = "$env:VCPKG_INSTALLED\bin\sqlite3.dll"
          if (-not (Test-Path $sqliteDll)) { throw "sqlite3.dll not found at $sqliteDll" }
          Copy-Item -Path $sqliteDll -Destination release\

      - name: Copy license files to release directory
        if: ${{ inputs.package }}
        # vcpkg copyrights come from the classic-mode install tree now, and Qt's
        # licence comes from the Qt install rather than a vcpkg port.
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release\LICENSES | Out-Null
          foreach ($pkg in @("fftw3", "flac", "ffmpeg", "sqlite3")) {
            $copyright = "$env:VCPKG_INSTALLED\share\$pkg\copyright"
            if (Test-Path $copyright) {
              Copy-Item -Path $copyright -Destination "release\LICENSES\copyright-$pkg"
            }
          }
          $qtLicense = Get-ChildItem -Path "$env:QT_DIR\..\..\Licenses\LICENSE*" -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($qtLicense) { Copy-Item -Path $qtLicense.FullName -Destination release\LICENSES\copyright-qt6 }
          else { Write-Warning "Qt licence file not found under $env:QT_DIR\..\..\Licenses" }
          if (Test-Path "$env:ONNXRUNTIME_ROOT\LICENSE") {
            Copy-Item -Path "$env:ONNXRUNTIME_ROOT\LICENSE" -Destination release\LICENSES\copyright-onnxruntime
          }
          if (Test-Path "$env:FFMPEG_DIR\LICENSE") {
            Copy-Item -Path "$env:FFMPEG_DIR\LICENSE" -Destination release\LICENSES\copyright-ffmpeg-bundled
          }
          if (Test-Path "$env:FLAC_DIR\COPYING.GPL") {
            Copy-Item -Path "$env:FLAC_DIR\COPYING.GPL" -Destination release\LICENSES\copyright-flac-bundled
          }
          Copy-Item -Path .\LICENSE -Destination release\LICENSES\copyright-tbc-tools

      - name: Build and copy vendored tbc-video-export to release directory
        if: ${{ inputs.package }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exporterRoot = "$env:GITHUB_WORKSPACE\src\tbc-video-export"
          $env:PYTHONPATH = "$exporterRoot\src"
          Push-Location $exporterRoot
          New-Item -ItemType Directory -Force -Path .\build | Out-Null
          python .\pyinstaller\build_windows.py
          Pop-Location
          $builtExporter = "$exporterRoot\dist\tbc-video-export.exe"
          if (-not (Test-Path $builtExporter)) {
            throw "Vendored tbc-video-export build did not produce $builtExporter"
          }
          Copy-Item -Path $builtExporter -Destination release\
          Copy-Item -Path "$exporterRoot\LICENSE" -Destination release\LICENSES\copyright-tbc-video-export
          Push-Location release
          .\tbc-video-export.exe --dump-default-config
          Pop-Location

      - name: Verify required Windows runtime files are present
        if: ${{ inputs.package }}
        # The backstop. windeployqt is trusted to find the Qt pieces, but this
        # still fails the build if anything a GUI tool needs to start on a clean
        # machine is absent -- which is also how a windeployqt regression would
        # surface.
        run: |
          $required = @(
            "release\qt.conf",
            "release\platforms\qwindows.dll",
            "release\sqldrivers\qsqlite.dll",
            "release\Qt6Core.dll",
            "release\Qt6Gui.dll",
            "release\Qt6Widgets.dll",
            "release\Qt6Sql.dll",
            "release\Qt6Svg.dll",
            "release\Qt6Network.dll",
            "release\FLAC.dll",
            "release\sqlite3.dll",
            "release\ld-lds-converter.exe",
            "release\tbc-analyse.exe",
            "release\tbc-video-export.exe",
            "release\ffmpeg.exe",
            "release\onnxruntime.dll",
            "release\vcruntime140.dll",
            "release\vcruntime140_1.dll",
            "release\msvcp140.dll",
            "release\vendor\vhs_decode_auto_audio_align\VhsDecodeAutoAudioAlign.exe",
            "release\vendor\vhs_decode_auto_audio_align\Binah.dll",
            "release\vendor\vhs-teletext\teletext\__main__.py",
            "release\vendor\vhs-teletext\misc\teletext-noscanlines.css",
            "release\vendor\vhs-teletext\misc\teletext2.ttf",
            "release\vendor\vhs-teletext\misc\teletext4.ttf"
          )
          $missing = @()
          foreach ($f in $required) { if (-not (Test-Path $f)) { $missing += $f } }
          if ($missing.Count -gt 0) {
            throw ("Missing required Windows runtime files (packaging incomplete):`n" + ($missing -join "`n"))
          }
          Write-Host "All required Windows runtime files present."

      - name: Upload release artifact
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v7
        with:
          # Downloaded by the same deploy run's win0 job, so one fixed name.
          name: selfhosted_tbc-tools_windows_x86_64
          path: release
          if-no-files-found: error
          retention-days: 7
