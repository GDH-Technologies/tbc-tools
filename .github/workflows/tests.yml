name: Tests

on:
  push:
  pull_request:
  release:
  workflow_dispatch:

concurrency:
  # Without this, nothing supersedes anything: every push starts a run AND the
  # resulting pull_request synchronize starts a second one, none of them cancel
  # each other, and each spends ~20 minutes on a full Nix build. Eight were
  # alive at once while this branch was being iterated on.
  #
  # head_ref || ref_name deliberately collapses both events for a branch into
  # one group: on a pull_request head_ref is the branch name, on a push it is
  # empty and ref_name is the same branch name, so a push to a PR branch leaves
  # exactly one run instead of two. Cancelling is safe here because this
  # workflow only reports -- it builds and tests, it never publishes.
  group: tbc-tools-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci-guardrails:
    name: CI guardrails
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - name: Run CI contract unit tests
        run: python3 -m unittest -v ci.tests.test_check_ci_contracts
      - name: Run GDH version scheme unit tests
        # Includes the parity check between the CMake APP_VERSION block and
        # scripts/gdh_version.py; needs full history and tags, which the
        # checkout above already provides.
        run: python3 -m unittest -v ci.tests.test_gdh_version
      - name: Run CI guardrails
        run: bash ci/run_local_ci_parity.sh --guardrails-only
  full-build-test:
    name: Full Linux build and test parity
    needs: ci-guardrails
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Restore and save Nix store cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-${{ runner.arch }}-
            nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
      - name: Build and test full parity flow
        run: bash ci/run_local_ci_parity.sh --build-test-only
  # Call the Release workflow in build-only mode (create_release=false) so
  # the full release pipeline — Linux + Windows + macOS packaging builds —
  # is exercised without publishing to GitHub Releases. This is a project hard
  # rule: build tests must use the release workflow to test all platforms but
  # must not publish. Do not replace it with per-platform build workflow calls.
  #
  # It is workflow_dispatch-only on this fork. Hosted runner minutes are
  # billable and the GDH fleet covers every push and PR through
  # self-hosted-linux.yml / self-hosted-macos.yml / self-hosted-windows.yml;
  # tag pushes still reach this same pipeline directly through release.yml.
  #
  # The explicit permissions block is load-bearing, not decoration. release.yml
  # declares `contents: write` + `actions: write`, a caller job may not grant a
  # callee more than it holds, and this repository's default workflow
  # permission is read-only -- without this the whole run is rejected before
  # any job starts ("This run likely failed because of a workflow file issue").
  release-style-build-all-platforms:
    name: Release-style build (all platforms, no publish)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: ci-guardrails
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release.yml
    with:
      create_release: false
    secrets: inherit
