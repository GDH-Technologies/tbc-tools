name: "Self-hosted build and deploy"

# Fork-exclusive. On a merge to main that touches build-relevant paths, install
# on each of the three build boxes (wm, air0, win0) and on the rest of the Linux
# fleet (wf1, lws, cs0, cs1). If a successful run in this repository (in
# practice, the PR's own checks) already built and tested this exact source
# tree, that build is reused. Otherwise the box rebuilds first. This is the ONLY
# entry point in the repository that installs anything.
#
# The Linux fleet never compiles: wm pushes the closure it just installed with
# `nix copy`, and each host's profile operation is then a store hit (see
# ci/deploy_fleet_host.sh). Every host is probed over SSH first, and an offline
# host is skipped rather than left queued for a day. The verdict job is red on
# any failure of a host that was attempted, and requires wm's Linux install to
# have succeeded whenever Linux was part of the plan; skipped hosts alone never
# turn a run red.
#
# The three platform workflows also trigger on `push: branches: [main]`, but
# each of their jobs stands down unless called with from_deploy=true, so a
# merge builds once per box rather than twice.

on:
  push:
    branches: [main]
    # First gate: GitHub skips the run entirely for a docs-only merge, so no
    # runner is woken at all. The per-platform gate in `detect` is the second.
    paths:
      - "src/**"
      - "ci/**"
      # ...but not the guardrail-only files in it. These cannot change an
      # artifact, and a contract edit should not cost a fleet rebuild. Order
      # matters: a later pattern overrides an earlier one.
      - "!ci/tests/**"
      - "!ci/check_ci_contracts.py"
      - "scripts/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "flake.nix"
      - "flake.lock"
      # A version bump is a commit whose only changed file is this one. Without
      # it here the deploy that matters most for a release is the one that gets
      # skipped, and the fleet keeps reporting the previous version.
      - ".gdh-version"
      - ".github/workflows/self-hosted-*.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to rebuild and deploy, comma-separated (linux, macos, windows)"
        required: false
        default: "linux,macos,windows"
        type: string

permissions:
  contents: read

concurrency:
  # One group for the whole fleet, and NEVER cancel. A cancelled run can
  # interrupt `nix profile upgrade` or the Windows directory swap halfway
  # through. GitHub keeps at most ONE pending run per group: a newer run
  # replaces an older one that is still waiting. Back-to-back merges therefore
  # deploy the running commit and then the newest, not every commit in between.
  group: tbc-tools-self-hosted-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect:
    name: Plan the deploy
    # wm-light: wm's second runner, for short jobs, so this never queues behind
    # a PR build that is occupying the main `wm` runner.
    runs-on: [self-hosted, Linux, X64, wm-light]
    permissions:
      contents: read
      # To find a reusable build: other runs' artifacts and conclusions.
      actions: read
    outputs:
      # Per platform: "reuse" (a successful same-repo run already built and
      # tested this exact source tree), "build", or "skip".
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      # The run whose Windows artifact deploy-windows installs when reusing.
      windows_run: ${{ steps.plan.outputs.windows_run }}
      # The git tree of the commit being deployed.
      tree: ${{ steps.plan.outputs.tree }}
      # JSON array of the Linux fleet hosts that answered the probe and have
      # Nix: deploy-fleet's matrix.
      fleet_hosts: ${{ steps.probe.outputs.fleet_hosts }}
    steps:
      - uses: actions/checkout@v5
        with:
          # dorny/paths-filter diffs against github.event.before on a push, so
          # it needs the history to reach it. Every event needs HEAD's tree.
          fetch-depth: 0
      # v4 declares the node24 runtime. v3 targets the deprecated node20, which
      # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 then forces onto node24 with a
      # deprecation warning. v4.0.0 changed nothing but the runtime.
      - uses: dorny/paths-filter@v4
        id: filter
        # A dispatch names its platforms explicitly; the diff decides only for a push.
        if: ${{ github.event_name == 'push' }}
        with:
          # No '!' patterns anywhere in these lists. Under the default
          # predicate-quantifier ('some'), a file matches a filter when it matches
          # ANY pattern, and '!ci/tests/**' matches every file outside ci/tests.
          # So a negation here silently turned every platform on for every change.
          # List what each platform actually consumes instead. The guardrail-only
          # files (ci/tests/**, ci/check_ci_contracts.py) are simply not listed.
          filters: |
            common: &common
              - 'src/**'
              - 'scripts/**'
              - 'CMakeLists.txt'
              - '.github/workflows/self-hosted-deploy.yml'
            linux:
              - *common
              - 'flake.nix'
              - 'flake.lock'
              # The flake derives the Nix build's version from these two.
              - 'vcpkg.json'
              - '.gdh-version'
              - 'ci/run_local_ci_parity.sh'
              - 'ci/verify_linux_bundle.sh'
              - 'ci/deploy_fleet_host.sh'
              - '.github/workflows/self-hosted-linux.yml'
            macos:
              - *common
              - 'flake.nix'
              - 'flake.lock'
              - 'vcpkg.json'
              - '.gdh-version'
              - 'ci/run_local_ci_parity.sh'
              - '.github/workflows/self-hosted-macos.yml'
            windows:
              - *common
              - 'vcpkg.json'
              - 'CMakePresets.json'
              # .gdh-version is deliberately absent: with .git present, CMake's
              # git-describe tier sets the Windows version from the tag, not the
              # file. A version bump arrives as a dispatch, which selects its
              # platforms explicitly.
              - '.github/workflows/self-hosted-windows.yml'
      - name: Probe hosts
        id: probe
        # An offline runner leaves its job queued for up to 24 hours, and a
        # host that is down cannot take a nix copy. So every target is probed
        # from wm first, over the per-host keys in ~/.ssh/config, and only what
        # answers is deployed. BatchMode fails instead of prompting; the outer
        # timeout covers a host that accepts TCP but then stalls.
        #
        # Linux fleet hosts: `command -v nix` exits 0 (online), 255 (ssh itself
        # failed: offline) or anything else (reachable but no Nix: skipped).
        # air0 and win0 are only checked for reachability; their jobs run on
        # their own runners.
        env:
          FLEET: wf1 lws cs0 cs1
        run: |
          set -uo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=5)
          fleet_json="[]"
          rows=""
          for host in $FLEET; do
            timeout 20 "${SSH[@]}" "$host" 'command -v nix' >/dev/null 2>&1
            rc=$?
            if [ "$rc" -eq 0 ]; then
              status="online"
              fleet_json="$(jq -c --arg h "$host" '. + [$h]' <<<"$fleet_json")"
            elif [ "$rc" -eq 255 ] || [ "$rc" -eq 124 ]; then
              status="offline"
            else
              status="no-nix"
            fi
            rows+="| $host | $status |"$'\n'
          done
          for host in air0 win0; do
            if timeout 20 "${SSH[@]}" "$host" exit >/dev/null 2>&1; then
              status="online"
            else
              status="offline"
            fi
            rows+="| $host | $status |"$'\n'
            echo "${host}_online=$([ "$status" = online ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          done
          echo "fleet_hosts=$fleet_json" >> "$GITHUB_OUTPUT"
          {
            echo "## Host probe"
            echo ""
            echo "| host | status |"
            echo "| --- | --- |"
            printf '%s' "$rows"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan each platform
        id: plan
        # Untrusted-by-default inputs go through env, never into the script text.
        env:
          MACOS_ONLINE: ${{ steps.probe.outputs.air0_online }}
          WINDOWS_ONLINE: ${{ steps.probe.outputs.win0_online }}
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
          F_LINUX: ${{ steps.filter.outputs.linux }}
          F_MACOS: ${{ steps.filter.outputs.macos }}
          F_WINDOWS: ${{ steps.filter.outputs.windows }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          TREE="$(git rev-parse 'HEAD^{tree}')"
          # Dispatch platforms are matched as whole comma-separated names.
          selected() { [[ ",${PLATFORMS// /}," == *",$1,"* ]]; }

          # A build of exactly this source that can be installed instead of
          # rebuilt. That means an unexpired artifact named for this full tree
          # hash, from a run in THIS repository that concluded successfully. The
          # platform workflows upload it as a job's last step, so such a run built
          # and passed ctest on this tree. head_repository_id rules out anything
          # a fork could have produced (fork PRs never run on the fleet anyway).
          # Prints the newest such run id, or nothing.
          reusable_run() {
            local name="$1-$TREE" ids id
            ids="$(gh api -X GET "repos/$REPO/actions/artifacts" -f name="$name" -f per_page=50 \
              --jq "[.artifacts[] | select(.expired == false
                       and .workflow_run.repository_id == $REPO_ID
                       and .workflow_run.head_repository_id == $REPO_ID)]
                    | sort_by(.created_at) | reverse | .[].workflow_run.id")" || return 0
            for id in $ids; do
              if [ "$(gh api "repos/$REPO/actions/runs/$id" --jq .conclusion)" = "success" ]; then
                echo "$id"
                return 0
              fi
            done
          }

          # On a push, the diff decides whether a platform is affected at all. An
          # affected platform reuses a matching build when one exists, and
          # otherwise builds. On a dispatch, the named platforms rebuild and the
          # rest skip: a dispatch is an explicit request, and the version bump's
          # tree is new anyway. All three are named by default, which the bump
          # relies on.
          plan() {
            local platform="$1" filtered="$2" artifact="$3" run
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if selected "$platform"; then echo "build -"; else echo "skip -"; fi
              return
            fi
            if [ "$filtered" != "true" ]; then echo "skip -"; return; fi
            run="$(reusable_run "$artifact")"
            if [ -n "$run" ]; then echo "reuse $run"; else echo "build -"; fi
          }

          read -r LINUX LINUX_RUN <<<"$(plan linux "$F_LINUX" selfhosted_tbc-tools_linux_x86_64)"
          read -r MACOS MACOS_RUN <<<"$(plan macos "$F_MACOS" selfhosted_tbc-tools_macos_arm64)"
          read -r WINDOWS WINDOWS_RUN <<<"$(plan windows "$F_WINDOWS" selfhosted_tbc-tools_windows_x86_64)"
          # An offline box is skipped rather than queued. Its build job would
          # wait on its runner just as its deploy job would.
          if [ "$MACOS" != "skip" ] && [ "$MACOS_ONLINE" != "true" ]; then
            MACOS=skip; MACOS_RUN="offline"
          fi
          if [ "$WINDOWS" != "skip" ] && [ "$WINDOWS_ONLINE" != "true" ]; then
            WINDOWS=skip; WINDOWS_RUN="-"; WINDOWS_NOTE="offline"
          fi
          [ "$WINDOWS_RUN" = "-" ] && WINDOWS_RUN=""
          {
            echo "tree=$TREE"
            echo "linux=$LINUX"
            echo "macos=$MACOS"
            echo "windows=$WINDOWS"
            echo "windows_run=$WINDOWS_RUN"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy plan for ${GITHUB_SHA} (${EVENT})"
            echo ""
            echo "Source tree \`${TREE}\`."
            echo ""
            echo "| platform | plan | build reused from run |"
            echo "| --- | --- | --- |"
            echo "| linux (wm, then the fleet) | ${LINUX} | ${LINUX_RUN} |"
            echo "| macos (air0)   | ${MACOS} | ${MACOS_RUN} |"
            echo "| windows (win0) | ${WINDOWS} | ${WINDOWS_RUN:-${WINDOWS_NOTE:--}} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # The build jobs run only when the plan found no reusable build of this tree.
  # On "reuse", the matching run already built it and passed ctest on it.
  build-linux:
    name: Build (wm)
    needs: detect
    if: ${{ needs.detect.outputs.linux == 'build' }}
    uses: ./.github/workflows/self-hosted-linux.yml
    with:
      # Pin every box to the exact merged commit, so another merge landing
      # mid-run cannot leave the three machines on different code.
      checkout_ref: ${{ github.sha }}
      from_deploy: true

  build-macos:
    name: Build (air0)
    needs: detect
    if: ${{ needs.detect.outputs.macos == 'build' }}
    uses: ./.github/workflows/self-hosted-macos.yml
    with:
      checkout_ref: ${{ github.sha }}
      from_deploy: true

  build-windows:
    name: Build (win0)
    needs: detect
    if: ${{ needs.detect.outputs.windows == 'build' }}
    uses: ./.github/workflows/self-hosted-windows.yml
    with:
      checkout_ref: ${{ github.sha }}
      from_deploy: true

  deploy-linux:
    name: Deploy to wm
    needs: [detect, build-linux]
    # On "reuse", build-linux is skipped and this install is a store hit: tree
    # identity makes this tree's derivation the one the PR run already built on
    # this box. !cancelled() is needed because a skipped dependency otherwise
    # skips this job too.
    if: ${{ !cancelled() && (needs.detect.outputs.linux == 'reuse' || (needs.detect.outputs.linux == 'build' && needs.build-linux.result == 'success')) }}
    # Same box as the build, so the store path the build job just produced is
    # right here. It runs on wm's light runner so the install never queues
    # behind a PR build on the main `wm` runner.
    runs-on: [self-hosted, Linux, X64, wm-light]
    outputs:
      # The tbc-tools store path wm just installed and smoke-tested. deploy-fleet
      # copies exactly this closure to the rest of the Linux fleet.
      store_path: ${{ steps.smoke.outputs.store_path }}
    env:
      # wm installs from a local flake rather than from GitHub, so the deploy
      # is: fast-forward the developer's real checkout, then upgrade. The
      # runner's own CI workspace is a different checkout entirely.
      CHECKOUT: /home/rdodge/Repos/tbc-tools
    steps:
      - name: Advance main in the working checkout and upgrade the profile
        run: |
          set -euo pipefail

          if [ ! -d "$CHECKOUT/.git" ]; then
            echo "Refusing to deploy: $CHECKOUT is not a git checkout." >&2
            exit 1
          fi

          git -C "$CHECKOUT" fetch --tags --prune --prune-tags --force origin

          # The profile entry's flake URL must be
          # git+file://$CHECKOUT?ref=refs/heads/main so that nix reads the main
          # REF -- not the working tree. Only that ref has to advance, which
          # means the developer's branch and uncommitted work are almost always
          # none of this job's business.
          #
          # That "?ref=" is load-bearing and is checked below. A bare
          # git+file://$CHECKOUT resolves to whatever branch HEAD happens to be
          # on, so `nix profile upgrade` silently builds the developer's branch
          # instead of main. That is what happened on 2026-09-09: the entry had
          # been installed unpinned, the checkout sat on a feature branch, and
          # the deploy installed that branch's commit and failed the check
          # below. Restore the pin with:
          #
          #   nix profile remove tbc-tools
          #   nix profile install "git+file://$CHECKOUT?ref=refs/heads/main"
          BRANCH="$(git -C "$CHECKOUT" rev-parse --abbrev-ref HEAD)"
          if [ "$BRANCH" = "main" ]; then
            # main is the checked-out branch, so the only way to move the ref
            # goes through the working tree -- which therefore has to be clean.
            # --porcelain ignores gitignored paths, so build/, result and
            # testout/ do not trip this; only real uncommitted work does.
            if [ -n "$(git -C "$CHECKOUT" status --porcelain)" ]; then
              echo "Refusing to deploy: $CHECKOUT is on main with uncommitted changes." >&2
              git -C "$CHECKOUT" status --short >&2
              exit 1
            fi
            git -C "$CHECKOUT" merge --ff-only "$GITHUB_SHA"
          else
            # main is not checked out: move the ref and leave the working tree
            # completely alone, whatever branch and uncommitted work it holds.
            # Without a leading '+' this refuses anything but a fast-forward,
            # which is the same safety property `merge --ff-only` gives above.
            echo "Checkout is on '$BRANCH'; advancing refs/heads/main without touching the working tree."
            git -C "$CHECKOUT" fetch --no-tags origin main:main
          fi

          MAIN_SHA="$(git -C "$CHECKOUT" rev-parse refs/heads/main)"
          if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "Refusing to deploy: $CHECKOUT main is at $MAIN_SHA, expected $GITHUB_SHA." >&2
            exit 1
          fi

          # Catch a lost pin before spending a build on the wrong commit: an
          # unpinned entry would resolve to HEAD's branch and the failure would
          # only show up as a confusing rev mismatch further down.
          if ! nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' \
               | grep -q "Original flake URL:.*$CHECKOUT?ref=refs/heads/main"; then
            echo "Refusing to deploy: the tbc-tools profile entry is not pinned to refs/heads/main." >&2
            echo "It would follow whatever branch the checkout has open. Re-pin it with:" >&2
            echo "  nix profile remove tbc-tools" >&2
            echo "  nix profile install 'git+file://$CHECKOUT?ref=refs/heads/main'" >&2
            nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' | grep "Original flake URL:" >&2 || true
            exit 1
          fi

          nix profile upgrade tbc-tools

          # Prove the upgrade actually moved rather than silently no-opping.
          # Match the commit on the Locked flake URL line rather than on a
          # `rev=` prefix: nix renders a git+file lock as
          # `...?ref=refs/heads/main&rev=<sha>` but a github: lock as
          # `github:owner/repo/<sha>`, and the deploy-macos job below needs the
          # same check to work against the second form.
          nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/profile.txt"
          cat "$RUNNER_TEMP/profile.txt"
          if ! grep -q "Locked flake URL:.*$GITHUB_SHA" "$RUNNER_TEMP/profile.txt"; then
            echo "wm profile is not at $GITHUB_SHA. Locked flake URL reads:" >&2
            grep "Locked flake URL:" "$RUNNER_TEMP/profile.txt" >&2 || true
            exit 1
          fi

      - name: Re-sync desktop integration
        # A nix profile install registers nothing with XDG (no mime.cache, no
        # mimeinfo.cache, no icon index), so INSTALL.md makes this a required
        # step after every upgrade -- it also picks up new application artwork.
        # It writes only under $XDG_DATA_HOME and is a no-op when current.
        run: |
          if command -v decode-desktop-sync >/dev/null 2>&1; then
            decode-desktop-sync
          else
            echo "decode-desktop-sync not on PATH; skipping XDG re-sync." >&2
          fi

      - name: Smoke test and report
        id: smoke
        # Resolve the binaries from the store path that was just installed,
        # not from PATH. The PATH form passed on wm and failed on air0 for a
        # deploy that had entirely succeeded: `command -v tbc-analyse` returned
        # nothing in 30ms because the runner service there does not have the
        # nix profile's bin on PATH. That is a property of the runner's
        # environment, not of the deployment, and it must not fail a good
        # deploy -- so it is reported below as a warning instead.
        #
        # Reading the store path also makes this a stronger check: it exercises
        # exactly the artifact this job installed rather than whatever the
        # shell happens to find.
        run: |
          set -euo pipefail
          # Scope this to the tbc-tools record. `nix profile list` prints every
          # entry in the profile, and taking the first "Store paths:" line
          # anywhere picked up decode-orc on wm, which sorts first -- so the
          # check looked for tbc-analyse inside the wrong package and failed a
          # deploy that had succeeded. Reading the first match was an ordering
          # assumption, the same shape of mistake as the PATH assumption this
          # block replaced.
          STORE="$(awk '/^Name:[[:space:]]+tbc-tools$/ { found = 1; next }
                        found && /^Store paths:/ { print $3; exit }' \
                   "$RUNNER_TEMP/profile.txt")"
          if [ -z "$STORE" ]; then
            echo "No tbc-tools entry with a store path in nix profile list:" >&2
            cat "$RUNNER_TEMP/profile.txt" >&2
            exit 1
          fi
          case "$STORE" in
            */*-tbc-tools-*) ;;
            *)
              echo "Resolved store path is not a tbc-tools build: $STORE" >&2
              exit 1
              ;;
          esac
          echo "Installed store path: $STORE"
          # The GUI binary is laid out differently per platform, so check both
          # rather than assume: Linux installs bin/tbc-analyse, macOS installs a
          # bundle at bin/tbc-analyse.app/Contents/MacOS/tbc-analyse. Asserting
          # the Linux path failed every air0 deploy -- correctly reporting a
          # file that genuinely is not there, for a build that was perfectly
          # fine.
          GUI=""
          for candidate in \
            "$STORE/bin/tbc-analyse" \
            "$STORE/bin/tbc-analyse.app/Contents/MacOS/tbc-analyse"; do
            if [ -x "$candidate" ]; then
              GUI="$candidate"
              break
            fi
          done
          if [ -z "$GUI" ]; then
            echo "No tbc-analyse in $STORE/bin (checked the plain and .app layouts):" >&2
            ls -la "$STORE/bin" >&2 || true
            exit 1
          fi
          echo "GUI binary: $GUI"

          # tbc-video-export is a plain CLI binary on both platforms, so it is
          # the one that can actually be executed here as a launch test.
          "$STORE/bin/tbc-video-export" --version

          # Non-fatal, and probed with tbc-video-export rather than tbc-analyse:
          # on macOS the GUI is only ever a bundle, so its absence from PATH
          # says nothing, whereas the CLI tool should be reachable on both.
          if ! command -v tbc-video-export >/dev/null 2>&1; then
            echo "::warning::tbc-tools is installed but not on PATH for this runner;" \
                 "add the nix profile's bin directory to the service environment."
          fi
          echo "store_path=$STORE" >> "$GITHUB_OUTPUT"
          {
            echo "## wm deploy"
            echo ""
            echo "Installed \`$GITHUB_SHA\` via \`nix profile upgrade tbc-tools\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-macos:
    name: Deploy to air0
    needs: [detect, build-macos]
    # On "reuse", build-macos is skipped and the github: install below is a
    # store hit, since the flake's src filter makes it evaluate to the
    # derivation the PR run built from its checkout. !cancelled() is needed
    # because a skipped dependency otherwise skips this job too.
    if: ${{ !cancelled() && (needs.detect.outputs.macos == 'reuse' || (needs.detect.outputs.macos == 'build' && needs.build-macos.result == 'success')) }}
    # air0-light: air0's second runner, for short jobs. On the main `air0`
    # runner this install (about 15 s of work) queued behind other repositories'
    # builds: five minutes behind vhs-decode's on the #28 merge. It runs on the
    # same box as the same user, so it upgrades the same nix profile and store
    # the PR run's build is already in.
    runs-on: [self-hosted, macOS, ARM64, air0-light]
    env:
      # air0 installs from the public fork rather than a local checkout.
      FLAKE_URL: github:GDH-Technologies/tbc-tools
    steps:
      - name: Install or upgrade the tbc-tools profile entry
        run: |
          set -euo pipefail

          # Nix renamed `profile install` to `profile add`; support both so a
          # version skew between wm and air0 does not break the deploy.
          if nix profile add --help >/dev/null 2>&1; then ADD=add; else ADD=install; fi

          if nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' | grep -qE '^Name:[[:space:]]+tbc-tools$'; then
            echo "Existing tbc-tools entry found; upgrading."
            # --refresh: github: flake refs are served from the tarball cache
            # (default TTL 1h) and would otherwise resolve to a stale commit.
            nix profile upgrade --refresh tbc-tools
          else
            echo "No tbc-tools entry in the profile; performing first install."
            nix profile "$ADD" --refresh "$FLAKE_URL"
          fi

          # air0's entry is a github: flake, which nix locks as
          # `github:owner/repo/<sha>` -- no `rev=` anywhere in it. Matching the
          # sha on the Locked flake URL line covers that and wm's git+file form
          # alike.
          nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/profile.txt"
          cat "$RUNNER_TEMP/profile.txt"
          if ! grep -q "Locked flake URL:.*$GITHUB_SHA" "$RUNNER_TEMP/profile.txt"; then
            # Report what the entry actually says rather than guessing why. The
            # first version of this check blamed "GitHub flake cache lag" for
            # what was really its own bad pattern, on a deploy that had in fact
            # succeeded -- a stale tarball cache is only one of the reasons this
            # can trip, and the locked URL distinguishes them.
            echo "air0 profile is not at $GITHUB_SHA. Locked flake URL reads:" >&2
            grep "Locked flake URL:" "$RUNNER_TEMP/profile.txt" >&2 || true
            exit 1
          fi

      - name: Smoke test and report
        # Resolve the binaries from the store path that was just installed,
        # not from PATH. The PATH form passed on wm and failed on air0 for a
        # deploy that had entirely succeeded: `command -v tbc-analyse` returned
        # nothing in 30ms because the runner service there does not have the
        # nix profile's bin on PATH. That is a property of the runner's
        # environment, not of the deployment, and it must not fail a good
        # deploy -- so it is reported below as a warning instead.
        #
        # Reading the store path also makes this a stronger check: it exercises
        # exactly the artifact this job installed rather than whatever the
        # shell happens to find.
        run: |
          set -euo pipefail
          # Scope this to the tbc-tools record. `nix profile list` prints every
          # entry in the profile, and taking the first "Store paths:" line
          # anywhere picked up decode-orc on wm, which sorts first -- so the
          # check looked for tbc-analyse inside the wrong package and failed a
          # deploy that had succeeded. Reading the first match was an ordering
          # assumption, the same shape of mistake as the PATH assumption this
          # block replaced.
          STORE="$(awk '/^Name:[[:space:]]+tbc-tools$/ { found = 1; next }
                        found && /^Store paths:/ { print $3; exit }' \
                   "$RUNNER_TEMP/profile.txt")"
          if [ -z "$STORE" ]; then
            echo "No tbc-tools entry with a store path in nix profile list:" >&2
            cat "$RUNNER_TEMP/profile.txt" >&2
            exit 1
          fi
          case "$STORE" in
            */*-tbc-tools-*) ;;
            *)
              echo "Resolved store path is not a tbc-tools build: $STORE" >&2
              exit 1
              ;;
          esac
          echo "Installed store path: $STORE"
          # The GUI binary is laid out differently per platform, so check both
          # rather than assume: Linux installs bin/tbc-analyse, macOS installs a
          # bundle at bin/tbc-analyse.app/Contents/MacOS/tbc-analyse. Asserting
          # the Linux path failed every air0 deploy -- correctly reporting a
          # file that genuinely is not there, for a build that was perfectly
          # fine.
          GUI=""
          for candidate in \
            "$STORE/bin/tbc-analyse" \
            "$STORE/bin/tbc-analyse.app/Contents/MacOS/tbc-analyse"; do
            if [ -x "$candidate" ]; then
              GUI="$candidate"
              break
            fi
          done
          if [ -z "$GUI" ]; then
            echo "No tbc-analyse in $STORE/bin (checked the plain and .app layouts):" >&2
            ls -la "$STORE/bin" >&2 || true
            exit 1
          fi
          echo "GUI binary: $GUI"

          # tbc-video-export is a plain CLI binary on both platforms, so it is
          # the one that can actually be executed here as a launch test.
          "$STORE/bin/tbc-video-export" --version

          # Non-fatal, and probed with tbc-video-export rather than tbc-analyse:
          # on macOS the GUI is only ever a bundle, so its absence from PATH
          # says nothing, whereas the CLI tool should be reachable on both.
          if ! command -v tbc-video-export >/dev/null 2>&1; then
            echo "::warning::tbc-tools is installed but not on PATH for this runner;" \
                 "add the nix profile's bin directory to the service environment."
          fi
          {
            echo "## air0 deploy"
            echo ""
            echo "Installed \`$GITHUB_SHA\` from \`$FLAKE_URL\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-windows:
    name: Deploy to win0
    needs: [detect, build-windows]
    # On "reuse", build-windows is skipped and this installs the release the
    # reused run built. !cancelled() is needed because a skipped dependency
    # otherwise skips this job too.
    if: ${{ !cancelled() && (needs.detect.outputs.windows == 'reuse' || (needs.detect.outputs.windows == 'build' && needs.build-windows.result == 'success')) }}
    runs-on: [self-hosted, Windows, X64, win0]
    permissions:
      contents: read
      # To download a reused build's artifact from the run that made it.
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Locate the packaged tree
        id: locate
        # Prefer a release already in this workspace. It is on this machine,
        # and round-tripping a few hundred megabytes through the artifact store
        # is pure waste. That release is this run's build output, or on "reuse"
        # often the PR run's own output, left in the same workspace. The
        # .build-tree stamp is what makes this safe: a workspace that was
        # cleaned, or holds a build of a different tree, falls through to the
        # artifact instead of installing the wrong binaries.
        env:
          DEPLOY_TREE: ${{ needs.detect.outputs.tree }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ws = Join-Path $env:GITHUB_WORKSPACE 'release'
          $stamp = Join-Path $ws '.build-tree'
          if ((Test-Path $stamp) -and ((Get-Content $stamp -Raw).Trim() -eq $env:DEPLOY_TREE)) {
            Write-Host "Using the release already in the workspace at $ws"
            "source=workspace" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "dir=$ws"          | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "Workspace tree absent or stale; falling back to the uploaded artifact."
            "source=artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "dir=incoming"    | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Download the packaged release
        if: steps.locate.outputs.source == 'artifact'
        uses: actions/download-artifact@v8
        with:
          name: selfhosted_tbc-tools_windows_x86_64-${{ needs.detect.outputs.tree }}
          path: incoming
          # On "reuse", from the run that built this tree; otherwise, this run.
          run-id: ${{ needs.detect.outputs.windows_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Swap the installed tree
        env:
          SRC_DIR: ${{ steps.locate.outputs.dir }}
          SRC_KIND: ${{ steps.locate.outputs.source }}
          DEPLOY_TREE: ${{ needs.detect.outputs.tree }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src     = $env:SRC_DIR
          $dest    = Join-Path $env:LOCALAPPDATA 'Programs\tbc-tools'
          $staging = "$dest.new"
          $backup  = "$dest.prev"

          if (-not (Test-Path (Join-Path $src 'tbc-analyse.exe'))) {
            throw "Source tree does not look like a tbc-tools release: $src"
          }
          # Whatever the source, workspace or artifact, it must have been built
          # from exactly the tree being deployed.
          $treeStamp = Join-Path $src '.build-tree'
          if (-not (Test-Path $treeStamp) -or ((Get-Content $treeStamp -Raw).Trim() -ne $env:DEPLOY_TREE)) {
            throw "Refusing to deploy: $src was not built from tree $env:DEPLOY_TREE"
          }

          # Clear debris from an interrupted previous deploy before staging.
          Remove-Item -Recurse -Force $staging, $backup -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Recurse -Force -Path (Join-Path $src '*') -Destination $staging

          # Fail cleanly if a tool is running out of the install directory. The
          # rename below would otherwise die on a file lock with the old tree
          # already moved aside.
          $running = Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($dest, [StringComparison]::OrdinalIgnoreCase) }
          if ($running) {
            $names = ($running | ForEach-Object { "$($_.ProcessName) (PID $($_.Id))" }) -join ', '
            Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
            throw "Refusing to deploy: tbc-tools is running from $dest -- $names. Close it and re-run."
          }

          if (Test-Path $dest) {
            try {
              Rename-Item -Path $dest -NewName (Split-Path $backup -Leaf) -ErrorAction Stop
            } catch {
              Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
              throw "Could not move the existing install aside (file lock?): $($_.Exception.Message)"
            }
          }
          try {
            Move-Item -Path $staging -Destination $dest -ErrorAction Stop
          } catch {
            if (Test-Path $backup) { Rename-Item -Path $backup -NewName (Split-Path $dest -Leaf) }
            throw "Could not move the new tree into place; previous install restored. $($_.Exception.Message)"
          }
          Remove-Item -Recurse -Force $backup -ErrorAction SilentlyContinue

          # tbc-video-export, not tbc-analyse: the latter is a GUI app and can
          # block or pop a window on an interactive session.
          & (Join-Path $dest 'tbc-video-export.exe') --version

          "## win0 deploy`n`nInstalled ``$env:GITHUB_SHA`` to ``$dest`` (source: $env:SRC_KIND)." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  deploy-fleet:
    name: Deploy to ${{ matrix.host }}
    needs: [detect, deploy-linux]
    # Only after wm's own install succeeded: its store path is what gets copied.
    # Hosts the probe found offline or without Nix are simply not in the matrix.
    if: ${{ !cancelled() && needs.deploy-linux.result == 'success' && needs.detect.outputs.fleet_hosts != '[]' && needs.detect.outputs.fleet_hosts != '' }}
    # Driven from wm over SSH, not from each host's own runner: wm holds the
    # closure and the per-host keys, and the capture servers' runners stay out
    # of reach of this public repository.
    runs-on: [self-hosted, Linux, X64, wm-light]
    timeout-minutes: 60
    strategy:
      # One host's failure must not cancel the others; the verdict job reports
      # every failure.
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.detect.outputs.fleet_hosts) }}
    env:
      HOST: ${{ matrix.host }}
      STORE: ${{ needs.deploy-linux.outputs.store_path }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Copy wm's build to the host
        # Needs rdodge in the host's nix.conf trusted-users: wm's paths are
        # unsigned. Only what the host lacks is transferred.
        run: |
          set -euo pipefail
          case "$STORE" in
            /nix/store/*-tbc-tools-*) ;;
            *) echo "deploy-linux reported no usable store path: '$STORE'" >&2; exit 1 ;;
          esac
          nix copy --no-check-sigs --to "ssh-ng://$HOST" "$STORE"

      - name: Install on the host and smoke test
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$HOST" \
            bash -s -- "$GITHUB_SHA" "$STORE" < ci/deploy_fleet_host.sh
          {
            echo "## $HOST deploy"
            echo ""
            echo "Installed \`$GITHUB_SHA\` (\`$STORE\`), copied from wm."
          } >> "$GITHUB_STEP_SUMMARY"

  verdict:
    name: Deploy verdict
    needs: [detect, build-linux, build-macos, build-windows, deploy-linux, deploy-macos, deploy-windows, deploy-fleet]
    # Always runs, so a skipped or failed dependency still yields a verdict.
    if: ${{ always() }}
    runs-on: [self-hosted, Linux, X64, wm-light]
    steps:
      - name: Decide
        # Red on any failure or cancellation of a job that ran. Skipped jobs
        # (a platform not in the plan, an offline box) never turn a run red.
        # When Linux was part of the plan, wm's install must have succeeded,
        # so at least one Linux host always holds the new build on green.
        env:
          NEEDS: ${{ toJSON(needs) }}
          LINUX_PLAN: ${{ needs.detect.outputs.linux }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS" > "$RUNNER_TEMP/results.md"
          {
            echo "## Deploy verdict"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            cat "$RUNNER_TEMP/results.md"
          } >> "$GITHUB_STEP_SUMMARY"
          bad="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::Deploy failed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          if [ "$LINUX_PLAN" != "skip" ] && [ "$(jq -r '."deploy-linux".result' <<<"$NEEDS")" != "success" ]; then
            echo "::error::Linux was planned ($LINUX_PLAN) but no Linux host was deployed."
            exit 1
          fi
          echo "Deploy green."
