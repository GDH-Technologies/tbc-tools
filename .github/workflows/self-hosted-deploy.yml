name: "Self-hosted deploy"

# Fork-exclusive. Install one tbc-tools commit on every GDH machine. This is
# the ONLY workflow in the repository that installs anything.
#
# gdh-release.yml calls it with the release commit it just tagged; it can also
# be run by hand (Actions -> Self-hosted deploy -> Run workflow) with any ref.
#
#   probe       resolve the ref to a commit; SSH-probe every host, so an
#               offline one is skipped instead of left queued for a day
#   wm          fast-forward the local checkout's main, `nix profile upgrade`
#               (builds and runs ctest: flake.nix doCheck), smoke test
#   Linux fleet nix copy wm's installed closure to wf1, lws, cs0, cs1, install
#               it there (a store hit, never a compile), smoke test
#   air0        `nix profile upgrade` from github: (builds and tests), smoke
#   win0        build, test and package on win0-test, then install the zip
#
# Every host runs the same smoke test: ci/gdh/smoke_installed.sh.

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit to deploy (gdh-release.yml passes the release commit)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag or branch to deploy"
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  # One deploy at a time, and NEVER cancelled: a cancelled run can interrupt
  # `nix profile upgrade` or the Windows directory swap halfway.
  group: tbc-tools-self-hosted-deploy
  cancel-in-progress: false

jobs:
  probe:
    name: Resolve the commit and probe hosts
    # wm-light: wm's second runner, for short jobs.
    runs-on: [self-hosted, Linux, X64, wm-light]
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      # Space-separated Linux fleet hosts that answered and have Nix.
      fleet_hosts: ${{ steps.probe.outputs.fleet_hosts }}
      air0_online: ${{ steps.probe.outputs.air0_online }}
      win0_online: ${{ steps.probe.outputs.win0_online }}
    steps:
      - name: Resolve the ref to a commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPO/commits/$REF" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$sha\` (\`$REF\`)." >> "$GITHUB_STEP_SUMMARY"

      - name: Probe hosts
        id: probe
        # Over the per-host keys in wm's ~/.ssh/config. BatchMode fails instead
        # of prompting; the outer timeout covers a host that accepts TCP but
        # then stalls. Linux fleet hosts: `command -v nix` exits 0 (online),
        # 255 or 124 (offline) or anything else (reachable but no Nix:
        # skipped). air0 and win0 are only checked for reachability; their
        # jobs run on their own runners.
        env:
          FLEET: wf1 lws cs0 cs1
        run: |
          set -uo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=5)
          fleet=""
          rows=""
          for host in $FLEET; do
            # The runner's default shell is `bash -e`, which `set -uo pipefail`
            # does not turn off: a bare failing ssh here aborted the whole step
            # with 255 on the first offline host instead of recording it.
            rc=0
            timeout 20 "${SSH[@]}" "$host" 'command -v nix' >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              status="online"
              fleet="${fleet:+$fleet }$host"
            elif [ "$rc" -eq 255 ] || [ "$rc" -eq 124 ]; then
              status="offline (skipped)"
            else
              status="no Nix (skipped)"
            fi
            rows+="| $host | $status |"$'\n'
          done
          for host in air0 win0; do
            rc=0
            timeout 20 "${SSH[@]}" "$host" exit >/dev/null 2>&1 || rc=$?
            online=false
            if [ "$rc" -eq 0 ]; then online=true; fi
            rows+="| $host | $([ "$online" = true ] && echo online || echo 'offline (skipped)') |"$'\n'
            echo "${host}_online=$online" >> "$GITHUB_OUTPUT"
          done
          echo "fleet_hosts=$fleet" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "| host | status |"
            echo "| --- | --- |"
            printf '%s' "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

  wm:
    name: Deploy to wm
    needs: probe
    # wm-light, so the install never queues behind a PR build on `wm`. The
    # build itself runs in wm's nix daemon, bounded by /etc/nix/nix.conf.
    runs-on: [self-hosted, Linux, X64, wm-light]
    timeout-minutes: 90
    outputs:
      # The store path wm installed: the Linux fleet gets exactly this closure.
      store_path: ${{ steps.smoke.outputs.store_path }}
    env:
      SHA: ${{ needs.probe.outputs.sha }}
      # wm installs from a local flake rather than from GitHub, so the deploy
      # is: fast-forward the developer's real checkout, then upgrade. The
      # runner's own CI workspace is a different checkout entirely.
      CHECKOUT: /home/rdodge/Repos/tbc-tools
    steps:
      - uses: actions/checkout@v7
        # Only for ci/gdh's scripts.
        with:
          persist-credentials: false
          ref: ${{ needs.probe.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: ci/gdh

      - name: Advance main in the working checkout and upgrade the profile
        run: |
          set -euo pipefail

          if [ ! -d "$CHECKOUT/.git" ]; then
            echo "Refusing to deploy: $CHECKOUT is not a git checkout." >&2
            exit 1
          fi

          git -C "$CHECKOUT" fetch --tags --prune --prune-tags --force origin

          # The profile entry's flake URL must be
          # git+file://$CHECKOUT?ref=refs/heads/main so that nix reads the main
          # REF -- not the working tree. Only that ref has to advance, so the
          # developer's branch and uncommitted work are almost always none of
          # this job's business. A bare git+file://$CHECKOUT resolves to
          # whatever branch HEAD is on: on 2026-09-09 an unpinned entry made
          # the deploy install a feature branch. Re-pin with:
          #   nix profile remove tbc-tools
          #   nix profile install "git+file://$CHECKOUT?ref=refs/heads/main"
          BRANCH="$(git -C "$CHECKOUT" rev-parse --abbrev-ref HEAD)"
          if [ "$BRANCH" = "main" ]; then
            # main is checked out, so moving it goes through the working tree,
            # which therefore has to be clean (gitignored paths do not count).
            if [ -n "$(git -C "$CHECKOUT" status --porcelain)" ]; then
              echo "Refusing to deploy: $CHECKOUT is on main with uncommitted changes." >&2
              git -C "$CHECKOUT" status --short >&2
              exit 1
            fi
            git -C "$CHECKOUT" merge --ff-only "$SHA"
          else
            # Move the ref only; without a leading '+' this refuses anything
            # but a fast-forward.
            echo "Checkout is on '$BRANCH'; advancing refs/heads/main without touching the working tree."
            git -C "$CHECKOUT" fetch --no-tags origin "$SHA:refs/heads/main"
          fi

          MAIN_SHA="$(git -C "$CHECKOUT" rev-parse refs/heads/main)"
          if [ "$MAIN_SHA" != "$SHA" ]; then
            echo "Refusing to deploy: $CHECKOUT main is at $MAIN_SHA, expected $SHA." >&2
            exit 1
          fi

          if ! nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' \
               | grep -q "Original flake URL:.*$CHECKOUT?ref=refs/heads/main"; then
            echo "Refusing to deploy: the tbc-tools profile entry is not pinned to refs/heads/main." >&2
            nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' | grep "Original flake URL:" >&2 || true
            exit 1
          fi

          # wm's auto-GC deletes any unrooted store path, mid-build if need be:
          # root the flake's inputs for the length of the build.
          ROOTS="$HOME/.cache/tbc-tools-selfhosted/gcroots"
          mkdir -p "$ROOTS"
          find "$ROOTS" -maxdepth 1 -name 'deploy-input-*' -mtime +1 -delete
          n=0
          for path in $(nix flake archive --json "git+file://$CHECKOUT?ref=refs/heads/main" \
                        | grep -o '"path":"[^"]*"' | cut -d'"' -f4); do
            nix-store --add-root "$ROOTS/deploy-input-$GITHUB_RUN_ID-$n" --realise "$path" > /dev/null
            n=$((n + 1))
          done

          nix profile upgrade -L tbc-tools

          # Prove the upgrade moved rather than silently no-opping.
          nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/profile.txt"
          if ! grep -q "Locked flake URL:.*$SHA" "$RUNNER_TEMP/profile.txt"; then
            echo "wm profile is not at $SHA. Locked flake URL reads:" >&2
            grep "Locked flake URL:" "$RUNNER_TEMP/profile.txt" >&2 || true
            exit 1
          fi

      - name: Re-sync desktop integration
        # A nix profile install registers nothing with XDG (no mime.cache, no
        # icon index), so INSTALL.md makes this a required step after every
        # upgrade. It writes only under $XDG_DATA_HOME.
        run: |
          if command -v decode-desktop-sync >/dev/null 2>&1; then
            decode-desktop-sync
          else
            echo "decode-desktop-sync not on PATH; skipping XDG re-sync." >&2
          fi

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          # Scoped to the tbc-tools record: other packages' entries sort around it.
          STORE="$(awk '/^Name:[[:space:]]+tbc-tools$/ { found = 1; next }
                        found && /^Store paths:/ { print $3; exit }' "$RUNNER_TEMP/profile.txt")"
          bash ci/gdh/smoke_installed.sh "$STORE"
          echo "store_path=$STORE" >> "$GITHUB_OUTPUT"
          echo "- **wm**: installed \`$SHA\` (\`$STORE\`)" >> "$GITHUB_STEP_SUMMARY"

  linux-fleet:
    name: Deploy to the Linux fleet
    needs: [probe, wm]
    # Only after wm's install: its store path is what gets copied. Hosts the
    # probe found offline or without Nix are not in the list.
    if: ${{ needs.probe.outputs.fleet_hosts != '' }}
    # Driven from wm over SSH, not from each host's own runner: wm holds the
    # closure and the per-host keys, and the capture servers' runners stay out
    # of reach of this public repository.
    runs-on: [self-hosted, Linux, X64, wm-light]
    timeout-minutes: 60
    env:
      SHA: ${{ needs.probe.outputs.sha }}
      STORE: ${{ needs.wm.outputs.store_path }}
      HOSTS: ${{ needs.probe.outputs.fleet_hosts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.probe.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: ci/gdh

      - name: Copy, install and smoke-test each host
        # One host's failure does not stop the others; the job fails at the end
        # if any host did. nix copy needs rdodge in the host's nix.conf
        # trusted-users (wm's paths are unsigned) and transfers only what the
        # host lacks.
        run: |
          set -uo pipefail
          SSH=(ssh -o BatchMode=yes -o ConnectTimeout=10)
          failed=""
          for host in $HOSTS; do
            echo "::group::$host"
            if nix copy --no-check-sigs --to "ssh-ng://$host" "$STORE" \
               && "${SSH[@]}" "$host" bash -s -- "$SHA" "$STORE" < ci/gdh/deploy_fleet_host.sh \
               && "${SSH[@]}" "$host" bash -s -- "$STORE" < ci/gdh/smoke_installed.sh; then
              echo "- **$host**: installed \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- **$host**: FAILED" >> "$GITHUB_STEP_SUMMARY"
              failed="$failed $host"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Deploy failed on:$failed"
            exit 1
          fi

  air0:
    name: Deploy to air0
    needs: probe
    if: ${{ needs.probe.outputs.air0_online == 'true' }}
    # air0-light: air0's second runner, for short jobs, so the install never
    # queues behind other repositories' builds on `air0`. Same box, same user,
    # same nix profile and store.
    runs-on: [self-hosted, macOS, ARM64, air0-light]
    timeout-minutes: 90
    env:
      SHA: ${{ needs.probe.outputs.sha }}
      # air0 installs from the public fork rather than a local checkout.
      FLAKE_URL: github:GDH-Technologies/tbc-tools
    steps:
      - uses: actions/checkout@v7
        # Only for ci/gdh's scripts; a full clone is 6.8 GB.
        with:
          persist-credentials: false
          ref: ${{ needs.probe.outputs.sha }}
          fetch-depth: 1
          sparse-checkout: ci/gdh

      - name: Install or upgrade the tbc-tools profile entry
        run: |
          set -euo pipefail

          # determinate-nixd's GC deletes unrooted store paths mid-build (PR #30
          # and #43 incidents): root the flake's inputs for the length of the build.
          ROOTS="$HOME/Library/Caches/tbc-tools-selfhosted/gcroots"
          mkdir -p "$ROOTS"
          find "$ROOTS" -maxdepth 1 -name 'deploy-input-*' -mtime +1 -delete
          n=0
          for path in $(nix flake archive --json "$FLAKE_URL/$SHA" | grep -o '"path":"[^"]*"' | cut -d'"' -f4); do
            nix-store --add-root "$ROOTS/deploy-input-$GITHUB_RUN_ID-$n" --realise "$path" > /dev/null
            n=$((n + 1))
          done

          # Nix renamed `profile install` to `profile add`; support both.
          if nix profile add --help >/dev/null 2>&1; then ADD=add; else ADD=install; fi
          if nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' | grep -qE '^Name:[[:space:]]+tbc-tools$'; then
            # --refresh: github: refs are served from the tarball cache (default
            # TTL 1h) and would otherwise resolve to a stale commit.
            nix profile upgrade --refresh -L tbc-tools
          else
            nix profile "$ADD" --refresh -L "$FLAKE_URL"
          fi

          # The tbc-tools record's lock and store path. A github: lock reads
          # github:owner/repo/<rev>?narHash=...
          nix profile list | sed -e 's/\x1b\[[0-9;]*m//g' > "$RUNNER_TEMP/profile.txt"
          record_field() {
            awk -v field="$1" '/^Name:[[:space:]]+tbc-tools$/ { found = 1; next }
                               found && /^Name:/ { exit }
                               found && index($0, field ":") == 1 { sub(/^[^:]*:[[:space:]]*/, ""); print; exit }' \
              "$RUNNER_TEMP/profile.txt"
          }
          LOCKED="$(record_field "Locked flake URL")"
          LOCKED_REV="$(printf '%s\n' "$LOCKED" | sed -nE 's#^github:[^/]+/[^/?]+/([0-9a-f]{40}).*#\1#p')"
          INSTALLED="$(record_field "Store paths" | awk '{ print $1 }')"

          # The profile follows main, so a PR merged between the release and
          # this job moves the lock past $SHA. That still passes when the later
          # commit builds the same store path as the release commit (a change
          # outside the flake's filtered source, such as .github/): air0 then
          # runs the release's exact build. Anything else is refused, as before.
          # (2026-11-26: #82 merged a minute after #80's release.)
          if [ "$LOCKED_REV" != "$SHA" ]; then
            SYSTEM="$(nix eval --impure --raw --expr builtins.currentSystem)"
            EXPECTED="$(nix eval --raw "$FLAKE_URL/$SHA#packages.$SYSTEM.default.outPath")"
            if [ "$INSTALLED" != "$EXPECTED" ]; then
              echo "air0 profile is not at $SHA and its build differs from the release's." >&2
              echo "Locked flake URL: $LOCKED" >&2
              echo "Installed: $INSTALLED; $SHA builds: $EXPECTED" >&2
              exit 1
            fi
            echo "::notice::air0: the profile locks ${LOCKED_REV:-<unparsed: $LOCKED>}, not $SHA, but resolved the release's store path ($EXPECTED)."
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          STORE="$(awk '/^Name:[[:space:]]+tbc-tools$/ { found = 1; next }
                        found && /^Store paths:/ { print $3; exit }' "$RUNNER_TEMP/profile.txt")"
          bash ci/gdh/smoke_installed.sh "$STORE"
          echo "- **air0**: installed \`$SHA\` (\`$STORE\`)" >> "$GITHUB_STEP_SUMMARY"

  win0-build:
    name: Build win0's release
    needs: probe
    if: ${{ needs.probe.outputs.win0_online == 'true' }}
    uses: ./.github/workflows/self-hosted-windows.yml
    with:
      ref: ${{ needs.probe.outputs.sha }}
      package: true

  win0:
    name: Deploy to win0
    needs: [probe, win0-build]
    runs-on: [self-hosted, Windows, X64, win0]
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clear the download directory
        # download-artifact extracts on top of whatever is there, and the swap
        # below copies all of it.
        run: Remove-Item -Recurse -Force incoming -ErrorAction SilentlyContinue

      - name: Download the packaged release
        uses: actions/download-artifact@v8
        with:
          name: selfhosted_tbc-tools_windows_x86_64
          path: incoming

      - name: Swap the installed tree
        env:
          SRC_DIR: incoming
          SHA: ${{ needs.probe.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src     = $env:SRC_DIR
          $dest    = Join-Path $env:LOCALAPPDATA 'Programs\tbc-tools'
          $staging = "$dest.new"
          $backup  = "$dest.prev"

          if (-not (Test-Path (Join-Path $src 'tbc-analyse.exe'))) {
            throw "Source tree does not look like a tbc-tools release: $src"
          }

          # Clear debris from an interrupted previous deploy before staging.
          Remove-Item -Recurse -Force $staging, $backup -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Recurse -Force -Path (Join-Path $src '*') -Destination $staging

          # Fail cleanly if a tool is running out of the install directory: the
          # rename below would otherwise die on a file lock with the old tree
          # already moved aside.
          $running = Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($dest, [StringComparison]::OrdinalIgnoreCase) }
          if ($running) {
            $names = ($running | ForEach-Object { "$($_.ProcessName) (PID $($_.Id))" }) -join ', '
            Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
            throw "Refusing to deploy: tbc-tools is running from $dest -- $names. Close it and re-run."
          }

          if (Test-Path $dest) {
            try {
              Rename-Item -Path $dest -NewName (Split-Path $backup -Leaf) -ErrorAction Stop
            } catch {
              Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
              throw "Could not move the existing install aside (file lock?): $($_.Exception.Message)"
            }
          }
          try {
            Move-Item -Path $staging -Destination $dest -ErrorAction Stop
          } catch {
            if (Test-Path $backup) { Rename-Item -Path $backup -NewName (Split-Path $dest -Leaf) }
            throw "Could not move the new tree into place; previous install restored. $($_.Exception.Message)"
          }
          Remove-Item -Recurse -Force $backup -ErrorAction SilentlyContinue

          # tbc-video-export, not tbc-analyse: the latter is a GUI app and can
          # block or pop a window on an interactive session.
          & (Join-Path $dest 'tbc-video-export.exe') --version

          "- **win0**: installed ``$env:SHA`` to ``$dest``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
