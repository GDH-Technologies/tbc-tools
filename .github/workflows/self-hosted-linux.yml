name: "Self-hosted Linux build (wm)"

# Fork-exclusive. PR check: build tbc-tools on wm and run its tests.
#
# `nix build .#` compiles tbc-tools and runs ctest inside the build (flake.nix
# doCheck), so the tested binaries are exactly the ones the fleet installs: wm
# and the Linux fleet install this same flake (self-hosted-deploy.yml), never a
# packaged artifact. Nothing is packaged here.
#
# A merge is released and deployed by gdh-release.yml, which builds again
# through `nix profile upgrade` on wm -- usually a store hit for an unchanged
# tree, since this job roots its result.

on:
  # Path-gated: a PR touching none of these produces no run. The list is
  # gdh_version.py's SHIPPED_PATHS plus this file (ci/gdh/check_ci.py keeps
  # them equal), so what is tested here is exactly what releases on merge.
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/self-hosted-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One build per PR at a time; a newer push supersedes the older build.
  group: tbc-tools-wm-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Build and test tbc-tools (x86_64, wm-test)
    # wm's dedicated test runner: registered with --no-default-labels, so its
    # only labels are self-hosted and wm-test and no generic Linux job can land
    # on it.
    runs-on: [self-hosted, wm-test]
    timeout-minutes: 90
    # A self-hosted runner must never execute code from a forked PR: this
    # repository is public, and the runner is a workstation.
    if: >-
      ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Report host and toolchain
        run: |
          nix --version
          df -h "$GITHUB_WORKSPACE" /nix | cat

      - uses: actions/checkout@v5
        # Shallow, no tags, no submodules: the Nix build reads only the tree
        # (its version comes from .gdh-version, its ezpwd from a flake input),
        # and a depth-1 checkout evaluates to the same derivation as a full one.
        with:
          fetch-depth: 1
          fetch-tags: false
          submodules: false

      - name: Build and test with Nix
        # ctest runs inside this build (flake.nix: doCheck), serially, and a
        # failing test fails the build.
        #
        # wm's nix.conf has min-free/max-free auto-GC, which deletes any store
        # path without a root -- mid-build if need be. So every flake input
        # source that `nix flake archive` reports gets an indirect root before
        # evaluation starts, and the result gets one via --out-link. The roots
        # are named for this run, so another run cannot remove them, and are
        # pruned after a day.
        run: |
          set -euo pipefail
          ROOTS="$HOME/.cache/tbc-tools-selfhosted/gcroots"
          mkdir -p "$ROOTS"
          find "$ROOTS" -maxdepth 1 \( -name 'result-*' -o -name 'flake-input-*-*' \) -mtime +1 -print -delete
          n=0
          for path in $(nix flake archive --json | grep -o '"path":"[^"]*"' | cut -d'"' -f4); do
            nix-store --add-root "$ROOTS/flake-input-$GITHUB_RUN_ID-$n" --realise "$path" > /dev/null
            n=$((n + 1))
          done
          echo "Rooted $n flake input sources"
          nix build .# --out-link "$ROOTS/result-$GITHUB_RUN_ID" -L
