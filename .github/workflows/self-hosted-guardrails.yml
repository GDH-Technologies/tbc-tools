name: "Self-hosted CI guardrails (wm)"

# Fork-exclusive. The fast check every PR gets, in seconds, whatever it
# touches:
#   * upstream's own guardrails (ci/run_local_ci_parity.sh --guardrails-only:
#     actionlint over every workflow, ci/check_ci_contracts.py and its tests),
#     run unchanged so the fork stays compatible with them;
#   * the fork's: ci/gdh's tests (the version scheme, CMake parity, the
#     checker) and ci/gdh/check_ci.py;
#   * that the PR leaves .gdh-version alone (gdh-release.yml owns it);
#   * that ctest really runs inside the Nix package build.
#
# Builds and tests of the code itself are the platform workflows'
# (self-hosted-linux/macos/windows.yml).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the PR supersedes the older run.
  group: tbc-tools-guardrails-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  guardrails:
    name: CI guardrails
    # wm-light: wm's second runner, for short jobs, so this never queues
    # behind the PR's own build on `wm`.
    runs-on: [self-hosted, Linux, X64, wm-light]
    timeout-minutes: 20
    # A forked PR must never execute on a workstation: this repository is
    # public.
    if: >-
      ${{ github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The version tests resolve with `git describe`, and check-pr needs
          # the base; a shallow checkout would answer wrongly.
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Refresh tags
        # The workspace persists between runs: a tag deleted or moved on the
        # remote must not linger here and poison `git describe`.
        run: git fetch --tags --prune --prune-tags --force origin

      - name: Provision actionlint from nixpkgs
        # Puts actionlint on PATH for the parity script, pinned to nixpkgs and
        # with no network download. --out-link, so wm's auto-GC cannot collect
        # it mid-run.
        run: |
          set -euo pipefail
          TOOLS="$HOME/.cache/tbc-tools-selfhosted/tools"
          mkdir -p "$TOOLS"
          nix build nixpkgs#actionlint --out-link "$TOOLS/actionlint"
          echo "$TOOLS/actionlint/bin" >> "$GITHUB_PATH"

      - name: Upstream guardrails
        run: bash ci/run_local_ci_parity.sh --guardrails-only

      - name: Fork tests and checks
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s ci/gdh -t .
          python3 ci/gdh/check_ci.py

      - name: The PR leaves .gdh-version alone
        if: ${{ github.event_name == 'pull_request' }}
        # refs/pull/N/merge: HEAD^1 is the base branch as it stands now.
        run: python3 scripts/gdh_version.py check-pr --base HEAD^1

      - name: ctest runs inside the package build
        # Asks Nix what the package actually does, on both platforms the fleet
        # builds with Nix.
        run: |
          set -euo pipefail
          linux="$(nix eval .#packages.x86_64-linux.default.doCheck)"
          darwin="$(nix eval .#packages.aarch64-darwin.default.doCheck)"
          echo "doCheck: x86_64-linux=$linux aarch64-darwin=$darwin"
          if [ "$linux" != true ] || [ "$darwin" != true ]; then
            echo "::error::ctest must run inside the package build on Linux and Darwin" >&2
            exit 1
          fi
